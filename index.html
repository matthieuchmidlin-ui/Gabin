<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#6C63FF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StudyQuest" />
  <meta name="description" content="L'app d'apprentissage ludique pour collégiens" />

  <title>StudyQuest 🚀</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Apple touch icons (générés en SVG inline converti) -->

  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- React + Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #0f0f23;
      font-family: 'Nunito', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #root { height: 100%; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { 0% { transform: scale(.8); opacity:0; } 70% { transform: scale(1.05); } 100% { transform: scale(1); opacity:1; } }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #6C63FF; border-radius: 99px; }
    button { font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
    input, textarea, select { font-family: 'Nunito', sans-serif; }

    /* Safe area pour iPhone avec encoche */
    .safe-top    { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

    /* Install banner */
    #install-banner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: linear-gradient(135deg, #6C63FF, #a78bfa);
      padding: 12px 16px; display: flex; align-items: center; gap: 12px;
      transform: translateY(-100%); transition: transform .4s ease;
      animation: none;
    }
    #install-banner.visible { transform: translateY(0); }
  </style>
</head>
<body>

<!-- Bannière installation iOS -->

  </div>
  <button onclick="document.getElementById('install-banner').classList.remove('visible')" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px">✕</button>

<div id="root"></div>

  ],
  english:[
    {q:"'Bonjour' en anglais ?",choices:["Goodbye","Hello","Please","Thanks"],answer:1},
    {q:"Past tense of 'go' ?",choices:["goed","gone","went","going"],answer:2},

    {q:"Pluriel de 'child' ?",choices:["childs","childes","children","childrens"],answer:2},

const FLASHCARDS = {
  math:[
    {front:"Qu'est-ce qu'un nombre premier ?",back:"Divisible uniquement par 1 et lui-même. Ex: 2, 3, 5, 7, 11..."},
    {front:"Aire d'un rectangle",back:"Aire = Longueur × Largeur"},

  ],

    {front:"Qu'est-ce que la photosynthèse ?",back:"Plantes : lumière + CO₂ + eau → sucre + oxygène."},

  ],
  english:[
    {front:"Les auxiliaires modaux",back:"Can, Could, May, Might, Must, Shall, Should, Will, Would."},
    {front:"Present Perfect vs Simple Past",back:"Present Perfect : lié au présent. Simple Past : action terminée."},
    {front:"Pronoms personnels sujets",back:"I, You, He, She, It, We, They"},
  ],
};

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const fileToBase64 = (file) => new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>res({base64:r.result.split(",")[1],type:file.type||"image/jpeg",dataUrl:r.result});
  r.onerror=()=>rej(new Error("Lecture échouée"));
  r.readAsDataURL(file);
});

const callClaudeWithImage = async (prompt,base64,mimeType)=>{
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mimeType,data:base64}},{type:"text",text:prompt}]}]})});
  const d=await r.json(); return d.content?.[0]?.text||"";
};

const callClaude = async (prompt)=>{
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:prompt}]})});
  const d=await r.json(); return d.content?.[0]?.text||"";
};

// Sauvegarde locale
const save = (key,val)=>{ try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){} };
const load = (key,def)=>{ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):def; }catch(e){ return def; } };

// ─── ATOMS ────────────────────────────────────────────────────────────────────
const XPBar=({xp,level})=>{
  const pct=Math.min((xp/(level*100))*100,100);
  return <div style={{background:"#1a1a2e",borderRadius:12,padding:"6px 10px",display:"flex",alignItems:"center",gap:10}}>
    <span style={{fontSize:13,color:"#a78bfa",fontWeight:700}}>Niv.{level}</span>
    <div style={{flex:1,height:8,background:"#2d2d4e",borderRadius:99,overflow:"hidden"}}>
      <div style={{width:`${pct}%`,height:"100%",background:"linear-gradient(90deg,#6C63FF,#a78bfa)",borderRadius:99,transition:"width .6s"}}/>
    </div>
    <span style={{fontSize:11,color:"#7c7cac"}}>{xp}/{level*100} XP</span>
  </div>;
};

const BadgeItem=({emoji,label,unlocked})=>(
  <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,opacity:unlocked?1:.3,filter:unlocked?"none":"grayscale(1)"}}>
    <div style={{width:52,height:52,borderRadius:"50%",background:unlocked?"linear-gradient(135deg,#6C63FF,#a78bfa)":"#2d2d4e",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,boxShadow:unlocked?"0 0 18px #6C63FF66":"none",border:unlocked?"2px solid #a78bfa":"2px solid #2d2d4e"}}>{emoji}</div>
    <span style={{fontSize:10,color:unlocked?"#a78bfa":"#4a4a6a",textAlign:"center",maxWidth:60}}>{label}</span>
  </div>
);

const Spinner=({text})=>(
  <div style={{textAlign:"center",padding:"24px 0"}}>
    <div style={{fontSize:32,animation:"spin 1s linear infinite",display:"inline-block"}}>⚙️</div>
    <p style={{color:"#7c7cac",fontSize:13,marginTop:8}}>{text}</p>
  </div>
);

const QBadge=({n})=>(
  <span style={{background:"#6C63FF22",color:"#a78bfa",borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:700}}>
    {n} question{n>1?"s":""}
  </span>
);

// ─── HOME ─────────────────────────────────────────────────────────────────────
const HomeView=({xp,level,streak,badges,courses,onNavigate})=>(
  <div style={{padding:"0 0 100px",animation:"fadeIn .3s ease"}}>
    <div style={{background:"linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)",padding:"32px 20px 28px",marginBottom:24,borderBottom:"1px solid #2d2d4e"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
        <div>
          <p style={{color:"#7c7cac",fontSize:13,margin:0}}>Bonjour 👋</p>
          <h2 style={{color:"#fff",fontSize:26,margin:"4px 0 0",fontFamily:"'Fredoka One',cursive"}}>Prêt à apprendre ?</h2>
        </div>
        <div style={{background:"#FF6584",borderRadius:20,padding:"4px 12px"}}>
          <span style={{color:"#fff",fontSize:13,fontWeight:700}}>🔥 {streak} jours</span>
        </div>
      </div>
      <XPBar xp={xp} level={level}/>
    </div>
    <div style={{padding:"0 16px"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:24}}>
        {[{label:"Cours",value:courses.length,emoji:"📚"},{label:"Quiz",value:24,emoji:"🎯"},{label:"XP",value:xp,emoji:"⭐"}].map(s=>(
          <div key={s.label} style={{background:"#1a1a2e",borderRadius:14,padding:"14px 10px",textAlign:"center",border:"1px solid #2d2d4e"}}>
            <div style={{fontSize:22}}>{s.emoji}</div>
            <div style={{color:"#fff",fontWeight:800,fontSize:20,lineHeight:1}}>{s.value}</div>
            <div style={{color:"#7c7cac",fontSize:11,marginTop:2}}>{s.label}</div>
          </div>
        ))}
      </div>
      <h3 style={{color:"#a78bfa",fontSize:12,letterSpacing:2,textTransform:"uppercase",margin:"0 0 12px",fontWeight:700}}>Commencer</h3>
      <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:28}}>
        {[
          {label:"📝 Mes Cours",sub:"Photo → quiz adapté + activités IA",view:"courses",color:"#6C63FF"},
          {label:"🎯 Quiz",sub:"Teste tes connaissances",view:"quiz",color:"#FF6584"},
          {label:"🃏 Flashcards",sub:"Mémorise en s'amusant",view:"flashcards",color:"#43B89C"},
          {label:"🎮 Mini-Jeux",sub:"Apprends en jouant",view:"games",color:"#F7B731"},
        ].map(a=>(
          <button key={a.view} onClick={()=>onNavigate(a.view)} style={{background:"#1a1a2e",border:`1px solid ${a.color}44`,borderRadius:16,padding:"16px 18px",cursor:"pointer",display:"flex",alignItems:"center",gap:14,textAlign:"left",width:"100%"}}>
            <div style={{width:44,height:44,borderRadius:12,background:`${a.color}22`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{a.label.split(" ")[0]}</div>

              <div style={{color:"#fff",fontWeight:700,fontSize:15}}>{a.label.slice(3)}</div>
              <div style={{color:"#7c7cac",fontSize:12,marginTop:2}}>{a.sub}</div>

            <span style={{marginLeft:"auto",color:a.color,fontSize:18}}>›</span>

      </div>
      <h3 style={{color:"#a78bfa",fontSize:12,letterSpacing:2,textTransform:"uppercase",margin:"0 0 12px",fontWeight:700}}>Mes Badges</h3>

        {badges.map(b=><BadgeItem key={b.id} {...b}/>)}
      </div>
    </div>
  </div>
);

// ─── COURSES ──────────────────────────────────────────────────────────────────
const CoursesView=({courses,onAddCourse,onViewCourse})=>{
  const [showForm,setShowForm]=useState(false);
  const [title,setTitle]=useState("");
  const [subject,setSubject]=useState("math");
  const [content,setContent]=useState("");
  const [imgDataUrl,setImgDataUrl]=useState(null);
  const [analyzing,setAnalyzing]=useState(false);
  const [analysis,setAnalysis]=useState(null);
  const [aiError,setAiError]=useState(false);
  const fileRef=useRef();

  const reset=()=>{setTitle("");setContent("");setImgDataUrl(null);setAnalysis(null);setAiError(false);setSubject("math");setShowForm(false);};

  const handlePhoto=async(e)=>{
    const file=e.target.files[0]; if(!file)return; e.target.value="";
    setAnalyzing(true);setAnalysis(null);setAiError(false);
    try{
      const {base64,type,dataUrl}=await fileToBase64(file);
      setImgDataUrl(dataUrl);
      const prompt=`Tu es un assistant pédagogique pour un élève de 5e (12 ans).
Analyse cette photo de cours. Réponds UNIQUEMENT en JSON valide sans backticks :
{"titre":"titre","matiere":"math|french|history|science|english","nb_questions":6,"nb_notions_detectees":6,"resume":"résumé 2-3 phrases","points_cles":["p1","p2","p3"],"quiz":[{"q":"?","choices":["A","B","C","D"],"answer":0}],"flashcards":[{"front":"?","back":"réponse"}],"jeu_vrai_faux":[{"affirmation":"...","vrai":true}],"astuce_memo":"astuce fun"}
RÈGLE quiz : 1 question par notion détectée, min 4 max 10.`;
      const raw=await callClaudeWithImage(prompt,base64,type);
      const parsed=JSON.parse(raw.replace(/```json|```/gi,"").trim());
      setAnalysis(parsed);
      if(parsed.titre)setTitle(parsed.titre);
      if(parsed.matiere&&SUBJECTS.find(s=>s.id===parsed.matiere))setSubject(parsed.matiere);
      if(parsed.resume)setContent(parsed.resume+(parsed.points_cles?.length?"\n\n📌 Points clés :\n"+parsed.points_cles.map(p=>"• "+p).join("\n"):""));
    }catch(err){setAiError(true);}
    setAnalyzing(false);
  };

  const handleSave=()=>{
    if(!title.trim())return;
    onAddCourse({id:Date.now(),title:title.trim(),subject,content,imgDataUrl,analysis,date:new Date().toLocaleDateString("fr-FR")});
    reset();
  };

  const getS=(id)=>SUBJECTS.find(s=>s.id===id)||SUBJECTS[0];

  return(
    <div style={{padding:"20px 16px 100px",animation:"fadeIn .3s ease"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h2 style={{color:"#fff",margin:0,fontSize:22,fontFamily:"'Fredoka One',cursive"}}>📚 Mes Cours</h2>
        <button onClick={()=>setShowForm(v=>!v)} style={{background:"linear-gradient(135deg,#6C63FF,#a78bfa)",border:"none",borderRadius:10,padding:"8px 16px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>
          {showForm?"✕ Fermer":"+ Ajouter"}
        </button>
      </div>

      {showForm&&(
        <div style={{background:"#1a1a2e",borderRadius:18,padding:20,border:"1px solid #6C63FF44",marginBottom:20,animation:"fadeIn .2s ease"}}>
          <h3 style={{color:"#a78bfa",margin:"0 0 16px",fontSize:15}}>📷 Nouveau cours</h3>
          <button onClick={()=>fileRef.current?.click()} style={{width:"100%",padding:"20px 16px",marginBottom:14,background:imgDataUrl?"#0d2218":"#16163a",border:`2px dashed ${imgDataUrl?"#43B89C":"#6C63FF"}`,borderRadius:14,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8,color:imgDataUrl?"#43B89C":"#a78bfa"}}>
            <span style={{fontSize:36}}>{imgDataUrl?"✅":"📷"}</span>
            <span style={{fontWeight:700,fontSize:14}}>{imgDataUrl?"Photo chargée — toucher pour changer":"Prendre / Importer une photo du cours"}</span>
            <span style={{fontSize:12,color:"#7c7cac"}}>L'IA génère un quiz adapté + flashcards + vrai/faux</span>
          </button>
          <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handlePhoto}/>
          {imgDataUrl&&<img src={imgDataUrl} alt="cours" style={{width:"100%",maxHeight:200,objectFit:"cover",borderRadius:12,marginBottom:14,border:"1px solid #43B89C44"}}/>}
          {analyzing&&<Spinner text="📖 L'IA analyse ton cours..."/>}
          {analysis&&!aiError&&(
            <div style={{background:"#0a2018",border:"1px solid #43B89C55",borderRadius:12,padding:14,marginBottom:14}}>
              <p style={{color:"#43B89C",fontWeight:700,margin:"0 0 6px",fontSize:14}}>✨ Cours analysé !</p>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <span style={{background:"#6C63FF22",color:"#a78bfa",borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:700}}>🎯 {analysis.nb_questions} questions</span>
                <span style={{background:"#43B89C22",color:"#43B89C",borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:700}}>🃏 {analysis.flashcards?.length} cartes</span>
                <span style={{background:"#F7B73122",color:"#F7B731",borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:700}}>⚡ {analysis.jeu_vrai_faux?.length} vrai/faux</span>
              </div>
              {analysis.astuce_memo&&<p style={{color:"#a78bfa",fontSize:12,margin:"8px 0 0",fontStyle:"italic"}}>💡 {analysis.astuce_memo}</p>}
            </div>
          )}
          {aiError&&<div style={{background:"#200a0a",border:"1px solid #FF658455",borderRadius:12,padding:12,marginBottom:14}}><p style={{color:"#FF6584",fontSize:13,margin:0}}>❌ Photo illisible. Essaie avec une meilleure lumière.</p></div>}
          <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Titre du cours..." style={{width:"100%",background:"#0f0f23",border:"1px solid #2d2d4e",borderRadius:10,padding:"10px 14px",color:"#fff",fontSize:14,outline:"none",marginBottom:10}}/>
          <select value={subject} onChange={e=>setSubject(e.target.value)} style={{width:"100%",background:"#0f0f23",border:"1px solid #2d2d4e",borderRadius:10,padding:"10px 14px",color:"#fff",fontSize:14,outline:"none",marginBottom:10}}>
            {SUBJECTS.map(s=><option key={s.id} value={s.id}>{s.emoji} {s.label}</option>)}
          </select>
          <textarea value={content} onChange={e=>setContent(e.target.value)} placeholder="Notes ou résumé..." rows={4} style={{width:"100%",background:"#0f0f23",border:"1px solid #2d2d4e",borderRadius:10,padding:"10px 14px",color:"#fff",fontSize:14,outline:"none",marginBottom:12,resize:"vertical",fontFamily:"inherit"}}/>
          <div style={{display:"flex",gap:8}}>
            <button onClick={handleSave} disabled={!title.trim()} style={{flex:1,background:title.trim()?"linear-gradient(135deg,#6C63FF,#a78bfa)":"#2d2d4e",border:"none",borderRadius:12,padding:13,color:"#fff",fontWeight:700,cursor:title.trim()?"pointer":"not-allowed",fontSize:15}}>💾 Enregistrer</button>
            <button onClick={reset} style={{background:"#2d2d4e",border:"none",borderRadius:12,padding:"13px 18px",color:"#7c7cac",cursor:"pointer"}}>Annuler</button>
          </div>
        </div>
      )}

      {courses.length===0&&!showForm&&(
        <div style={{textAlign:"center",padding:"60px 20px",color:"#7c7cac"}}>
          <div style={{fontSize:52,marginBottom:12}}>📷</div>
          <p style={{fontSize:15,lineHeight:1.6}}>Prends une photo de ton cours<br/>L'IA adapte le quiz à la densité du contenu !</p>
        </div>
      )}

      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {courses.map(c=>{
          const sv=getS(c.subject);
          return(
            <button key={c.id} onClick={()=>onViewCourse(c)} style={{background:"#1a1a2e",border:`1px solid ${sv.color}44`,borderRadius:16,padding:0,cursor:"pointer",overflow:"hidden",textAlign:"left",display:"block",width:"100%"}}>
              {c.imgDataUrl&&<img src={c.imgDataUrl} alt="" style={{width:"100%",height:120,objectFit:"cover"}}/>}
              <div style={{padding:"14px 16px"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
                  <span style={{background:`${sv.color}22`,color:sv.color,borderRadius:8,padding:"2px 8px",fontSize:11,fontWeight:700}}>{sv.emoji} {sv.label}</span>
                  {c.analysis&&<span style={{background:"#6C63FF22",color:"#a78bfa",borderRadius:8,padding:"2px 8px",fontSize:11,fontWeight:700}}>🎯 {c.analysis.nb_questions}Q</span>}
                  <span style={{color:"#7c7cac",fontSize:11,marginLeft:"auto"}}>{c.date}</span>
                </div>
                <h4 style={{color:"#fff",margin:0,fontSize:15}}>{c.title}</h4>
                {c.content&&<p style={{color:"#7c7cac",fontSize:12,margin:"5px 0 0",lineHeight:1.5}}>{c.content.slice(0,80)}{c.content.length>80?"...":""}</p>}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
};

// ─── COURSE DETAIL ────────────────────────────────────────────────────────────
const CourseDetail=({course,onBack,onXP})=>{
  const sv=SUBJECTS.find(s=>s.id===course.subject)||SUBJECTS[0];
  const ar=course.analysis;
  const hasAI=ar&&!ar.error;
  const TABS=[
    {id:"resume",label:"📋 Résumé"},
    ...(hasAI&&ar.quiz?.length?[{id:"quiz",label:`🎯 Quiz (${ar.quiz.length}Q)`}]:[]),
    ...(hasAI&&ar.flashcards?.length?[{id:"flash",label:"🃏 Cartes"}]:[]),
    ...(hasAI&&ar.jeu_vrai_faux?.length?[{id:"vf",label:"⚡ Vrai/Faux"}]:[]),
    {id:"bilan",label:"✨ Bilan IA"},
  ];
  const [tab,setTab]=useState("resume");
  const [qIdx,setQIdx]=useState(0);const [qSel,setQSel]=useState(null);const [qScore,setQScore]=useState(0);const [qDone,setQDone]=useState(false);
  const [fIdx,setFIdx]=useState(0);const [fFlip,setFFlip]=useState(false);
  const [vIdx,setVIdx]=useState(0);const [vScore,setVScore]=useState(0);const [vDone,setVDone]=useState(false);const [vFeed,setVFeed]=useState(null);
  const [bilan,setBilan]=useState("");const [bilanLoad,setBilanLoad]=useState(false);

  const q=hasAI?ar.quiz:[];
  const fc=hasAI?ar.flashcards:[];
  const vf=hasAI?ar.jeu_vrai_faux:[];

  const handleQ=(i)=>{
    if(qSel!==null)return; setQSel(i);
    const ok=i===q[qIdx].answer; if(ok){setQScore(s=>s+1);onXP(10);}
    setTimeout(()=>{if(qIdx+1<q.length){setQIdx(x=>x+1);setQSel(null);}else setQDone(true);},1100);
  };

  const handleVF=(ans)=>{
    const ok=ans===vf[vIdx].vrai; setVFeed(ok);
    if(ok){setVScore(s=>s+1);onXP(8);}
    setTimeout(()=>{if(vIdx+1<vf.length){setVIdx(x=>x+1);setVFeed(null);}else setVDone(true);},1000);
  };

  const genBilan=async()=>{
    setBilanLoad(true);
    const txt=await callClaude(`Prof bienveillant pour élève de 5e (12 ans). Cours : "${course.title}" (${sv.label}). Contenu : ${course.content||"cours en image"}. ${hasAI?"Points clés : "+ar.points_cles?.join(", "):""}. Génère un bilan motivant avec emojis : 1. 📌 Essentiel (3 bullets) 2. 💡 Exemple concret 3. ⚡ Astuce mémo fun 4. 🌟 Encouragement. Max 200 mots, langage simple.`);
    setBilan(txt); setBilanLoad(false); onXP(15);
  };

  const pctQ=q.length>0?Math.round((qScore/q.length)*100):0;

  return(
    <div style={{padding:"20px 16px 100px",animation:"fadeIn .3s ease"}}>
      <button onClick={onBack} style={{background:"none",border:"none",color:"#a78bfa",cursor:"pointer",fontSize:15,marginBottom:12,padding:0,display:"flex",alignItems:"center",gap:6}}>← Retour</button>
      {course.imgDataUrl&&<img src={course.imgDataUrl} alt="" style={{width:"100%",borderRadius:16,marginBottom:14,maxHeight:190,objectFit:"cover",border:"1px solid #2d2d4e"}}/>}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
        <span style={{background:`${sv.color}22`,color:sv.color,borderRadius:8,padding:"3px 10px",fontSize:12,fontWeight:700}}>{sv.emoji} {sv.label}</span>
        {hasAI&&<QBadge n={q.length}/>}
      </div>
      <h2 style={{color:"#fff",fontSize:20,margin:"0 0 16px"}}>{course.title}</h2>

      <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:18,paddingBottom:4}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{background:tab===t.id?"linear-gradient(135deg,#6C63FF,#a78bfa)":"#1a1a2e",border:tab===t.id?"none":"1px solid #2d2d4e",borderRadius:20,padding:"6px 14px",color:tab===t.id?"#fff":"#7c7cac",cursor:"pointer",fontSize:12,fontWeight:700,whiteSpace:"nowrap",flexShrink:0}}>
            {t.label}
          </button>
        ))}
      </div>

      {tab==="resume"&&(
        <div>
          {hasAI&&(
            <div style={{background:"#0a2018",border:"1px solid #43B89C33",borderRadius:14,padding:16,marginBottom:14}}>
              <p style={{color:"#43B89C",fontWeight:700,margin:"0 0 10px"}}>📌 Points clés</p>
              {ar.points_cles?.map((p,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:6}}><span style={{color:"#43B89C",flexShrink:0}}>•</span><span style={{color:"#c5c5e0",fontSize:13,lineHeight:1.5}}>{p}</span></div>)}
              {ar.astuce_memo&&<div style={{marginTop:12,padding:"10px 12px",background:"#6C63FF22",borderRadius:10}}><span style={{color:"#a78bfa",fontSize:13}}>💡 {ar.astuce_memo}</span></div>}
            </div>
          )}
          {course.content&&<div style={{background:"#1a1a2e",borderRadius:14,padding:16,border:"1px solid #2d2d4e",color:"#c5c5e0",fontSize:14,lineHeight:1.7,whiteSpace:"pre-wrap"}}>{course.content}</div>}
        </div>
      )}

      {tab==="quiz"&&q.length>0&&(
        qDone?(
          <div style={{textAlign:"center",padding:"32px 0",animation:"pop .4s ease"}}>
            <div style={{fontSize:56,marginBottom:12}}>{pctQ===100?"🏆":pctQ>=75?"🌟":pctQ>=50?"💪":"📚"}</div>
            <h3 style={{color:"#fff",fontSize:24,fontFamily:"'Fredoka One',cursive",margin:"0 0 6px"}}>{pctQ===100?"Parfait !":pctQ>=75?"Très bien !":pctQ>=50?"Pas mal !":"Continue !"}</h3>
            <p style={{color:"#a78bfa",fontSize:26,fontWeight:700,margin:"0 0 4px"}}>{qScore}/{q.length}</p>
            <p style={{color:"#7c7cac",fontSize:13,margin:"0 0 20px"}}>{pctQ}% de réussite</p>
            <div style={{height:10,background:"#2d2d4e",borderRadius:99,marginBottom:24,overflow:"hidden"}}>
              <div style={{width:`${pctQ}%`,height:"100%",background:pctQ>=75?"linear-gradient(90deg,#43B89C,#2dd4bf)":pctQ>=50?"linear-gradient(90deg,#F7B731,#ffd43b)":"linear-gradient(90deg,#FF6584,#ff8fab)",borderRadius:99,transition:"width .8s"}}/>
            </div>
            <button onClick={()=>{setQIdx(0);setQSel(null);setQScore(0);setQDone(false);}} style={{background:"linear-gradient(135deg,#6C63FF,#a78bfa)",border:"none",borderRadius:14,padding:"13px 28px",color:"#fff",fontWeight:700,cursor:"pointer"}}>Recommencer</button>
          </div>
        ):(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <span style={{color:"#7c7cac",fontSize:13}}>Q {qIdx+1}/{q.length}</span>
              <QBadge n={q.length}/>
              <span style={{color:"#a78bfa",fontWeight:700}}>⭐ {qScore}</span>
            </div>
            <div style={{height:6,background:"#2d2d4e",borderRadius:99,marginBottom:20,overflow:"hidden"}}>
              <div style={{width:`${((qIdx+1)/q.length)*100}%`,height:"100%",background:"linear-gradient(90deg,#6C63FF,#a78bfa)",borderRadius:99,transition:"width .4s"}}/>
            </div>
            <div style={{background:"#1a1a2e",borderRadius:18,padding:"22px 18px",border:"1px solid #2d2d4e",textAlign:"center",marginBottom:18}}>
              <p style={{color:"#fff",fontSize:17,fontWeight:700,margin:0,lineHeight:1.5}}>{q[qIdx].q}</p>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {q[qIdx].choices.map((c,i)=>{
                let bg="#1a1a2e",border="1px solid #2d2d4e",col="#fff";
                if(qSel!==null){if(i===q[qIdx].answer){bg="#0d2b22";border="1px solid #43B89C";col="#43B89C";}else if(i===qSel){bg="#2b0d0d";border="1px solid #FF6584";col="#FF6584";}}
                return <button key={i} onClick={()=>handleQ(i)} style={{background:bg,border,borderRadius:14,padding:"13px 16px",color:col,fontWeight:600,fontSize:14,cursor:"pointer",textAlign:"left",transition:"all .3s",width:"100%"}}><span style={{opacity:.5,marginRight:8}}>{["A","B","C","D"][i]}.</span>{c}</button>;
              })}
            </div>
          </div>
        )
      )}

      {tab==="flash"&&fc.length>0&&(
        fIdx>=fc.length?(
          <div style={{textAlign:"center",padding:"32px 0",animation:"pop .4s ease"}}>
            <div style={{fontSize:52}}>🎉</div>
            <h3 style={{color:"#fff",fontFamily:"'Fredoka One',cursive",marginBottom:16}}>Toutes vues !</h3>
            <button onClick={()=>{setFIdx(0);setFFlip(false);onXP(20);}} style={{background:"linear-gradient(135deg,#43B89C,#2dd4bf)",border:"none",borderRadius:14,padding:"12px 28px",color:"#fff",fontWeight:700,cursor:"pointer"}}>Recommencer (+20 XP)</button>
          </div>
        ):(
          <div>
            <div style={{textAlign:"right",color:"#7c7cac",fontSize:13,marginBottom:12}}>{fIdx+1}/{fc.length}</div>
            <div onClick={()=>setFFlip(f=>!f)} style={{minHeight:200,background:fFlip?`${sv.color}11`:"#1a1a2e",border:`2px solid ${fFlip?sv.color+"88":"#2d2d4e"}`,borderRadius:22,padding:"28px 22px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",marginBottom:18,transition:"all .4s"}}>
              <div style={{fontSize:28,marginBottom:10}}>{fFlip?"💡":"❓"}</div>
              <p style={{color:fFlip?sv.color:"#fff",fontSize:16,fontWeight:fFlip?500:700,margin:0,lineHeight:1.6}}>{fFlip?fc[fIdx].back:fc[fIdx].front}</p>
              {!fFlip&&<p style={{color:"#7c7cac",fontSize:12,marginTop:14}}>Touche pour voir la réponse</p>}
            </div>
            {fFlip&&<div style={{display:"flex",gap:10}}>
              <button onClick={()=>{setFIdx(i=>i+1);setFFlip(false);onXP(5);}} style={{flex:1,background:"#0d2b22",border:"1px solid #43B89C",borderRadius:14,padding:13,color:"#43B89C",fontWeight:700,cursor:"pointer"}}>✅ Compris !</button>
              <button onClick={()=>{setFIdx(i=>i+1);setFFlip(false);}} style={{flex:1,background:"#2b0d0d",border:"1px solid #FF6584",borderRadius:14,padding:13,color:"#FF6584",fontWeight:700,cursor:"pointer"}}>🔄 À revoir</button>
            </div>}
          </div>
        )
      )}

      {tab==="vf"&&vf.length>0&&(
        vDone?(
          <div style={{textAlign:"center",padding:"32px 0",animation:"pop .4s ease"}}>
            <div style={{fontSize:52}}>{vScore>=vf.length?"🏆":"💪"}</div>
            <h3 style={{color:"#fff",fontFamily:"'Fredoka One',cursive"}}>{vScore}/{vf.length}</h3>
            <button onClick={()=>{setVIdx(0);setVScore(0);setVDone(false);setVFeed(null);}} style={{background:"linear-gradient(135deg,#F7B731,#ffd43b)",border:"none",borderRadius:14,padding:"12px 28px",color:"#1a1a2e",fontWeight:700,cursor:"pointer",marginTop:14}}>Recommencer</button>
          </div>
        ):(
          <div>
            <div style={{textAlign:"right",color:"#7c7cac",fontSize:13,marginBottom:14}}>{vIdx+1}/{vf.length} · ⭐ {vScore}</div>
            <div style={{background:"#1a1a2e",borderRadius:20,padding:"28px 20px",border:"1px solid #2d2d4e",textAlign:"center",marginBottom:20}}>
              <p style={{color:"#fff",fontSize:17,fontWeight:700,margin:0,lineHeight:1.5}}>{vf[vIdx].affirmation}</p>
            </div>
            {vFeed!==null
              ?<div style={{textAlign:"center",fontSize:24,fontWeight:700,color:vFeed?"#43B89C":"#FF6584",padding:16,animation:"pop .3s ease"}}>{vFeed?"✅ Bravo !":"❌ Pas cette fois !"}</div>
              :<div style={{display:"flex",gap:12}}>
                <button onClick={()=>handleVF(true)} style={{flex:1,background:"#0d2b22",border:"2px solid #43B89C",borderRadius:16,padding:18,color:"#43B89C",fontWeight:800,fontSize:18,cursor:"pointer"}}>✅ VRAI</button>
                <button onClick={()=>handleVF(false)} style={{flex:1,background:"#2b0d0d",border:"2px solid #FF6584",borderRadius:16,padding:18,color:"#FF6584",fontWeight:800,fontSize:18,cursor:"pointer"}}>❌ FAUX</button>
              </div>
            }
          </div>
        )
      )}

      {tab==="bilan"&&(
        <div>
          {!bilan&&!bilanLoad&&(
            <div style={{textAlign:"center",padding:"24px 0"}}>
              <div style={{fontSize:48,marginBottom:12}}>✨</div>
              <p style={{color:"#7c7cac",marginBottom:20}}>L'IA génère un bilan personnalisé pour ce cours.</p>
              <button onClick={genBilan} style={{background:"linear-gradient(135deg,#43B89C,#2dd4bf)",border:"none",borderRadius:14,padding:"14px 28px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:15}}>Générer mon bilan</button>
            </div>
          )}
          {bilanLoad&&<Spinner text="Génération du bilan..."/>}
          {bilan&&!bilanLoad&&(
            <div style={{background:"#0a2018",border:"1px solid #43B89C44",borderRadius:16,padding:20}}>
              <h3 style={{color:"#43B89C",margin:"0 0 14px"}}>📋 Bilan de Révision</h3>
              <div style={{color:"#c5c5e0",fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap"}}>{bilan}</div>
              <button onClick={()=>setBilan("")} style={{marginTop:14,background:"none",border:"1px solid #2d2d4e",borderRadius:10,padding:"8px 16px",color:"#7c7cac",cursor:"pointer",fontSize:12}}>🔄 Régénérer</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
};

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
const QuizView=({onXP})=>{
  const [step,setStep]=useState("choose");const [sel,setSel]=useState(null);
  const [qs,setQs]=useState([]);const [cur,setCur]=useState(0);const [chosen,setChosen]=useState(null);const [score,setScore]=useState(0);

  const start=(s)=>{setSel(s);const all=[...(SAMPLE_QUIZZES[s.id]||[])].sort(()=>Math.random()-.5);setQs(all);setCur(0);setChosen(null);setScore(0);setStep("quiz");};
  const answer=(i)=>{
    if(chosen!==null)return; setChosen(i);
    const ok=i===qs[cur].answer; if(ok){setScore(s=>s+1);onXP(12);}
    setTimeout(()=>{if(cur+1<qs.length){setCur(c=>c+1);setChosen(null);}else setStep("result");},1100);
  };

  if(step==="choose")return(
    <div style={{padding:"20px 16px 100px",animation:"fadeIn .3s ease"}}>
      <h2 style={{color:"#fff",margin:"0 0 6px",fontSize:22,fontFamily:"'Fredoka One',cursive"}}>🎯 Quiz</h2>
      <p style={{color:"#7c7cac",fontSize:13,marginBottom:20}}>Toutes les questions par matière</p>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {SUBJECTS.map(s=>(
          <button key={s.id} onClick={()=>start(s)} style={{background:"#1a1a2e",border:`1px solid ${s.color}44`,borderRadius:16,padding:"18px 20px",cursor:"pointer",display:"flex",alignItems:"center",gap:14,width:"100%"}}>
            <div style={{width:50,height:50,borderRadius:14,fontSize:26,background:`${s.color}22`,display:"flex",alignItems:"center",justifyContent:"center"}}>{s.emoji}</div>
            <div style={{textAlign:"left"}}><div style={{color:"#fff",fontWeight:700,fontSize:16}}>{s.label}</div><div style={{color:"#7c7cac",fontSize:12}}>{SAMPLE_QUIZZES[s.id]?.length} questions</div></div>
            <span style={{marginLeft:"auto",color:s.color,fontSize:20}}>›</span>
          </button>
        ))}
      </div>
    </div>
  );

  if(step==="quiz"&&qs[cur]){
    const q=qs[cur]; const pct=Math.round(((cur+1)/qs.length)*100);
    return(
      <div style={{padding:"20px 16px 100px",animation:"fadeIn .2s ease"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <span style={{color:sel.color,fontWeight:700}}>{sel.emoji} {sel.label}</span>
          <QBadge n={qs.length}/>
          <span style={{color:"#7c7cac",fontSize:13}}>{cur+1}/{qs.length}</span>
        </div>
        <div style={{height:6,background:"#2d2d4e",borderRadius:99,marginBottom:20,overflow:"hidden"}}>
          <div style={{width:`${pct}%`,height:"100%",background:sel.color,borderRadius:99,transition:"width .4s"}}/>
        </div>
        <div style={{background:"#1a1a2e",borderRadius:20,padding:"24px 18px",border:"1px solid #2d2d4e",textAlign:"center",marginBottom:20}}>
          <p style={{color:"#fff",fontSize:18,fontWeight:700,margin:0,lineHeight:1.5}}>{q.q}</p>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {q.choices.map((c,i)=>{
            let bg="#1a1a2e",border="1px solid #2d2d4e",col="#fff";
            if(chosen!==null){if(i===q.answer){bg="#0d2b22";border="1px solid #43B89C";col="#43B89C";}else if(i===chosen){bg="#2b0d0d";border="1px solid #FF6584";col="#FF6584";}}
            return <button key={i} onClick={()=>answer(i)} style={{background:bg,border,borderRadius:14,padding:"13px 16px",color:col,fontWeight:600,fontSize:14,cursor:"pointer",textAlign:"left",transition:"all .3s",width:"100%"}}><span style={{opacity:.5,marginRight:8}}>{["A","B","C","D"][i]}.</span>{c}</button>;
          })}
        </div>
      </div>
    );
  }

  if(step==="result"){
    const pct=Math.round((score/qs.length)*100);
    return(
      <div style={{padding:"40px 16px 100px",textAlign:"center",animation:"fadeIn .3s ease"}}>
        <div style={{fontSize:64,marginBottom:12,animation:"pop .4s ease"}}>{pct===100?"🏆":pct>=75?"🌟":pct>=50?"💪":"📚"}</div>
        <h2 style={{color:"#fff",fontSize:26,fontFamily:"'Fredoka One',cursive",margin:"0 0 6px"}}>{pct===100?"Parfait !":pct>=75?"Très bien !":pct>=50?"Pas mal !":"Continue !"}</h2>
        <p style={{color:"#a78bfa",fontSize:22,fontWeight:700,margin:"0 0 4px"}}>{score}/{qs.length}</p>
        <p style={{color:"#7c7cac",fontSize:14,margin:"0 0 24px"}}>{pct}%</p>
        <div style={{height:10,background:"#2d2d4e",borderRadius:99,marginBottom:24,overflow:"hidden"}}>
          <div style={{width:`${pct}%`,height:"100%",background:pct>=75?"linear-gradient(90deg,#43B89C,#2dd4bf)":pct>=50?"linear-gradient(90deg,#F7B731,#ffd43b)":"linear-gradient(90deg,#FF6584,#ff8fab)",borderRadius:99,transition:"width .8s"}}/>
        </div>
        <div style={{display:"flex",gap:10,justifyContent:"center"}}>
          <button onClick={()=>start(sel)} style={{flex:1,background:"linear-gradient(135deg,#6C63FF,#a78bfa)",border:"none",borderRadius:14,padding:14,color:"#fff",fontWeight:700,cursor:"pointer"}}>Rejouer</button>
          <button onClick={()=>setStep("choose")} style={{background:"#1a1a2e",border:"1px solid #2d2d4e",borderRadius:14,padding:"14px 18px",color:"#7c7cac",cursor:"pointer"}}>Changer</button>
        </div>
      </div>
    );
  }
  return null;
};

// ─── FLASHCARDS ───────────────────────────────────────────────────────────────
const FlashcardsView=({onXP})=>{
  const [subj,setSubj]=useState(null);const [idx,setIdx]=useState(0);const [flipped,setFlipped]=useState(false);
  if(!subj)return(
    <div style={{padding:"20px 16px 100px",animation:"fadeIn .3s ease"}}>
      <h2 style={{color:"#fff",margin:"0 0 6px",fontSize:22,fontFamily:"'Fredoka One',cursive"}}>🃏 Flashcards</h2>
      <p style={{color:"#7c7cac",fontSize:13,marginBottom:20}}>Touche pour retourner la carte</p>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {SUBJECTS.map(s=>(
          <button key={s.id} onClick={()=>{setSubj(s);setIdx(0);setFlipped(false);}} style={{background:"#1a1a2e",border:`1px solid ${s.color}44`,borderRadius:16,padding:"18px 20px",cursor:"pointer",display:"flex",alignItems:"center",gap:14,width:"100%"}}>
            <span style={{fontSize:28}}>{s.emoji}</span>
            <div style={{textAlign:"left"}}><div style={{color:"#fff",fontWeight:700,fontSize:16}}>{s.label}</div><div style={{color:"#7c7cac",fontSize:12}}>{FLASHCARDS[s.id]?.length} cartes</div></div>
            <span style={{marginLeft:"auto",color:s.color,fontSize:20}}>›</span>
          </button>
        ))}
      </div>
    </div>
  );
  const cards=FLASHCARDS[subj.id]||[];
  if(idx>=cards.length)return(
    <div style={{padding:"40px 16px 100px",textAlign:"center"}}>
      <div style={{fontSize:52,marginBottom:12}}>🎉</div>
      <h2 style={{color:"#fff",fontFamily:"'Fredoka One',cursive"}}>Terminé !</h2>
      <button onClick={()=>{setSubj(null);onXP(30);}} style={{background:"linear-gradient(135deg,#43B89C,#2dd4bf)",border:"none",borderRadius:14,padding:"14px 32px",color:"#fff",fontWeight:700,cursor:"pointer",marginTop:12}}>Terminer (+30 XP)</button>
    </div>
  );
  const card=cards[idx];
  return(
    <div style={{padding:"20px 16px 100px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18}}>
        <button onClick={()=>setSubj(null)} style={{background:"none",border:"none",color:"#a78bfa",cursor:"pointer",fontSize:15,padding:0}}>←</button>
        <span style={{color:subj.color,fontWeight:700}}>{subj.emoji} {subj.label}</span>
        <span style={{marginLeft:"auto",color:"#7c7cac",fontSize:13}}>{idx+1}/{cards.length}</span>
      </div>
      <div onClick={()=>setFlipped(f=>!f)} style={{minHeight:200,background:flipped?`${subj.color}11`:"#1a1a2e",border:`2px solid ${flipped?subj.color+"88":"#2d2d4e"}`,borderRadius:22,padding:"28px 22px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",marginBottom:18,transition:"all .4s"}}>
        <div style={{fontSize:28,marginBottom:10}}>{flipped?"💡":"❓"}</div>
        <p style={{color:flipped?subj.color:"#fff",fontSize:16,fontWeight:flipped?500:700,margin:0,lineHeight:1.6}}>{flipped?card.back:card.front}</p>
        {!flipped&&<p style={{color:"#7c7cac",fontSize:12,marginTop:14}}>Touche pour voir la réponse</p>}
      </div>
      {flipped&&<div style={{display:"flex",gap:10}}>
        <button onClick={()=>{setIdx(i=>i+1);setFlipped(false);onXP(5);}} style={{flex:1,background:"#0d2b22",border:"1px solid #43B89C",borderRadius:14,padding:13,color:"#43B89C",fontWeight:700,cursor:"pointer"}}>✅ Compris !</button>
        <button onClick={()=>{setIdx(i=>i+1);setFlipped(false);}} style={{flex:1,background:"#2b0d0d",border:"1px solid #FF6584",borderRadius:14,padding:13,color:"#FF6584",fontWeight:700,cursor:"pointer"}}>🔄 À revoir</button>
      </div>}
    </div>
  );
};

// ─── GAMES ────────────────────────────────────────────────────────────────────
const GamesView=({onXP})=>{
  const [game,setGame]=useState(null);
  const [calcQ,setCalcQ]=useState(null);const [calcInput,setCalcInput]=useState("");const [calcFeedback,setCalcFeedback]=useState(null);const [calcScore,setCalcScore]=useState(0);const [calcRound,setCalcRound]=useState(0);
  const WORDS=[{word:"PHOTOSYNTHESE",hint:"Processus des plantes"},{word:"REVOLUTION",hint:"Événement historique"},{word:"POURCENTAGE",hint:"Fraction sur 100"},{word:"METAPHORE",hint:"Figure de style"},{word:"ATMOSPHERE",hint:"Couche gazeuse"}];
  const [hw,setHw]=useState(null);const [guessed,setGuessed]=useState([]);const [wrong,setWrong]=useState(0);
  const MAX=6;const AZ="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  const genCalc=()=>{
    const ops=["+","-","×"];const op=ops[Math.floor(Math.random()*3)];let a,b,ans;
    if(op==="+"){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*50)+1;ans=a+b;}
    else if(op==="-"){a=Math.floor(Math.random()*50)+20;b=Math.floor(Math.random()*20)+1;ans=a-b;}
    else{a=Math.floor(Math.random()*12)+1;b=Math.floor(Math.random()*12)+1;ans=a*b;}
    setCalcQ({a,b,op,answer:ans});setCalcInput("");setCalcFeedback(null);
  };
  const checkCalc=()=>{
    const ok=parseInt(calcInput)===calcQ.answer;
    setCalcFeedback(ok?"✅ Correct !":"❌ C'était "+calcQ.answer);
    if(ok){setCalcScore(s=>s+1);onXP(10);}
    setCalcRound(r=>r+1);
    setTimeout(()=>{if(calcRound+1<5)genCalc();else setGame("calc_result");},1100);
  };
  const startHm=()=>{const w=WORDS[Math.floor(Math.random()*WORDS.length)];setHw(w);setGuessed([]);setWrong(0);};
  const guessL=(l)=>{if(guessed.includes(l))return;setGuessed(g=>[...g,l]);if(!hw.word.includes(l))setWrong(w=>w+1);};
  const won=hw&&hw.word.split("").every(l=>guessed.includes(l));
  const lost=wrong>=MAX;

  if(!game)return(
    <div style={{padding:"20px 16px 100px",animation:"fadeIn .3s ease"}}>
      <h2 style={{color:"#fff",margin:"0 0 6px",fontSize:22,fontFamily:"'Fredoka One',cursive"}}>🎮 Mini-Jeux</h2>
      <p style={{color:"#7c7cac",fontSize:13,marginBottom:20}}>Apprends en t'amusant !</p>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {[{id:"calc",emoji:"⚡",label:"Calcul Mental",desc:"5 calculs rapides",color:"#F7B731"},{id:"hangman",emoji:"🎭",label:"Mot Mystère",desc:"Trouve le mot lettre par lettre",color:"#6C63FF"}].map(g=>(
          <button key={g.id} onClick={()=>{setGame(g.id);if(g.id==="calc"){setCalcScore(0);setCalcRound(0);genCalc();}if(g.id==="hangman")startHm();}} style={{background:"#1a1a2e",border:`1px solid ${g.color}44`,borderRadius:20,padding:"22px 20px",cursor:"pointer",display:"flex",alignItems:"center",gap:16,textAlign:"left",width:"100%"}}>
            <div style={{width:60,height:60,borderRadius:16,background:`${g.color}22`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:32,flexShrink:0}}>{g.emoji}</div>
            <div><div style={{color:"#fff",fontWeight:700,fontSize:17}}>{g.label}</div><div style={{color:"#7c7cac",fontSize:12,marginTop:4}}>{g.desc}</div></div>
            <span style={{marginLeft:"auto",color:g.color,fontSize:20}}>›</span>
          </button>
        ))}
      </div>
    </div>
  );

  if(game==="calc"&&calcQ&&calcRound<5)return(
    <div style={{padding:"20px 16px 100px"}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:18}}>
        <button onClick={()=>setGame(null)} style={{background:"none",border:"none",color:"#a78bfa",cursor:"pointer",fontSize:15,padding:0}}>←</button>
        <span style={{color:"#F7B731",fontWeight:700}}>⚡ Calcul</span>
        <span style={{color:"#7c7cac"}}>{calcRound}/5</span>
      </div>
      <div style={{background:"#1a1a2e",borderRadius:24,padding:"40px 24px",border:"1px solid #F7B73144",textAlign:"center",marginBottom:24}}>
        <p style={{color:"#fff",fontSize:40,fontWeight:800,margin:0,fontFamily:"'Fredoka One',cursive"}}>{calcQ.a} {calcQ.op} {calcQ.b} = ?</p>
      </div>
      {calcFeedback
        ?<div style={{textAlign:"center",fontSize:20,fontWeight:700,color:calcFeedback.startsWith("✅")?"#43B89C":"#FF6584",padding:16,background:"#1a1a2e",borderRadius:14,animation:"pop .3s ease"}}>{calcFeedback}</div>
        :<div style={{display:"flex",gap:10}}>
          <input value={calcInput} onChange={e=>setCalcInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&calcInput&&checkCalc()} type="number" placeholder="Réponse..." style={{flex:1,background:"#1a1a2e",border:"1px solid #F7B73144",borderRadius:14,padding:"14px 18px",color:"#fff",fontSize:22,outline:"none",textAlign:"center"}}/>
          <button onClick={checkCalc} disabled={!calcInput} style={{background:"linear-gradient(135deg,#F7B731,#ffd43b)",border:"none",borderRadius:14,padding:"14px 20px",color:"#1a1a2e",fontWeight:800,cursor:"pointer",fontSize:16}}>OK</button>
        </div>
      }
      <div style={{textAlign:"center",marginTop:16,color:"#a78bfa"}}>Score : {calcScore} ⭐</div>
    </div>
  );

  if(game==="calc_result")return(
    <div style={{padding:"40px 16px 100px",textAlign:"center",animation:"fadeIn .3s ease"}}>
      <div style={{fontSize:52,marginBottom:12}}>⚡</div>
      <h2 style={{color:"#fff",fontSize:26,fontFamily:"'Fredoka One',cursive"}}>Résultat</h2>
      <p style={{color:"#F7B731",fontSize:32,fontWeight:800,margin:"0 0 24px"}}>{calcScore}/5</p>
      <div style={{display:"flex",gap:10,justifyContent:"center"}}>
        <button onClick={()=>{setCalcScore(0);setCalcRound(0);genCalc();setGame("calc");}} style={{background:"linear-gradient(135deg,#F7B731,#ffd43b)",border:"none",borderRadius:14,padding:"14px 28px",color:"#1a1a2e",fontWeight:700,cursor:"pointer"}}>Rejouer</button>
        <button onClick={()=>setGame(null)} style={{background:"#1a1a2e",border:"1px solid #2d2d4e",borderRadius:14,padding:"14px 20px",color:"#7c7cac",cursor:"pointer"}}>Menu</button>
      </div>
    </div>
  );

  if(game==="hangman"&&hw){
    const dw=hw.word.split("").map((l,i)=>(
      <span key={i} style={{display:"inline-block",width:26,borderBottom:"2px solid #6C63FF",margin:"0 3px",textAlign:"center",fontSize:18,fontWeight:700,color:guessed.includes(l)?"#a78bfa":"transparent",minHeight:28}}>{guessed.includes(l)?l:" "}</span>
    ));
    return(
      <div style={{padding:"20px 16px 100px"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:18}}>
          <button onClick={()=>setGame(null)} style={{background:"none",border:"none",color:"#a78bfa",cursor:"pointer",fontSize:15,padding:0}}>←</button>
          <span style={{color:"#6C63FF",fontWeight:700}}>🎭 Mot Mystère</span>
          <span style={{color:"#FF6584",fontWeight:700}}>{wrong}/{MAX} ❌</span>
        </div>
        <div style={{background:"#1a1a2e",borderRadius:20,padding:24,border:"1px solid #6C63FF44",textAlign:"center",marginBottom:18}}>
          <p style={{color:"#7c7cac",fontSize:12,margin:"0 0 8px"}}>💡 {hw.hint}</p>
          <div style={{flexWrap:"wrap",display:"flex",justifyContent:"center",marginBottom:16}}>{dw}</div>
          <div style={{fontSize:24}}>{Array.from({length:MAX}).map((_,i)=><span key={i} style={{opacity:i<wrong?1:.15}}>💀</span>)}</div>
        </div>
        {(won||lost)
          ?<div style={{textAlign:"center",animation:"pop .4s ease"}}>
            <div style={{fontSize:44,marginBottom:10}}>{won?"🎉":"😢"}</div>
            <p style={{color:won?"#43B89C":"#FF6584",fontSize:17,fontWeight:700}}>{won?"Bravo !":"Le mot : "+hw.word}</p>
            <div style={{display:"flex",gap:10,justifyContent:"center",marginTop:14}}>
              <button onClick={()=>{startHm();if(won)onXP(40);}} style={{background:"linear-gradient(135deg,#6C63FF,#a78bfa)",border:"none",borderRadius:14,padding:"13px 26px",color:"#fff",fontWeight:700,cursor:"pointer"}}>Nouveau</button>
              <button onClick={()=>setGame(null)} style={{background:"#1a1a2e",border:"1px solid #2d2d4e",borderRadius:14,padding:"13px 18px",color:"#7c7cac",cursor:"pointer"}}>Menu</button>
            </div>
          </div>
          :<div style={{display:"flex",flexWrap:"wrap",gap:5,justifyContent:"center"}}>
            {AZ.map(l=>(
              <button key={l} onClick={()=>guessL(l)} disabled={guessed.includes(l)} style={{width:36,height:36,borderRadius:8,border:"1px solid",borderColor:guessed.includes(l)?(hw.word.includes(l)?"#43B89C44":"#FF658444"):"#2d2d4e",background:guessed.includes(l)?(hw.word.includes(l)?"#0d2b22":"#2b0d0d"):"#1a1a2e",color:guessed.includes(l)?(hw.word.includes(l)?"#43B89C":"#FF6584"):"#fff",cursor:guessed.includes(l)?"default":"pointer",fontWeight:700,fontSize:12}}>{l}</button>
            ))}
          </div>
        }
      </div>
    );
  }
  return null;
};

// ─── PROFIL ───────────────────────────────────────────────────────────────────
const ProfileView=({xp,level,streak,badges,courses})=>(
  <div style={{padding:"20px 16px 100px",animation:"fadeIn .3s ease"}}>
    <div style={{background:"linear-gradient(135deg,#6C63FF22,#a78bfa11)",borderRadius:24,padding:"32px 20px",textAlign:"center",border:"1px solid #6C63FF33",marginBottom:22}}>
      <div style={{width:80,height:80,borderRadius:"50%",margin:"0 auto 14px",background:"linear-gradient(135deg,#6C63FF,#a78bfa)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:40}}>🎓</div>
      <h2 style={{color:"#fff",fontSize:24,margin:"0 0 4px",fontFamily:"'Fredoka One',cursive"}}>Mon Profil</h2>
      <p style={{color:"#a78bfa",margin:0}}>Élève de 5ème</p>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:22}}>
      {[{label:"Niveau",value:level,emoji:"⬆️",color:"#6C63FF"},{label:"XP Total",value:xp,emoji:"⭐",color:"#F7B731"},{label:"Série",value:`${streak}j`,emoji:"🔥",color:"#FF6584"},{label:"Cours",value:courses.length,emoji:"📚",color:"#43B89C"}].map(s=>(
        <div key={s.label} style={{background:"#1a1a2e",borderRadius:16,padding:"18px 16px",border:`1px solid ${s.color}33`,textAlign:"center"}}>
          <div style={{fontSize:26,marginBottom:5}}>{s.emoji}</div>
          <div style={{color:s.color,fontWeight:800,fontSize:24}}>{s.value}</div>
          <div style={{color:"#7c7cac",fontSize:12}}>{s.label}</div>
        </div>
      ))}
    </div>
    <h3 style={{color:"#a78bfa",fontSize:12,letterSpacing:2,textTransform:"uppercase",margin:"0 0 12px",fontWeight:700}}>Mes Badges</h3>
    <div style={{background:"#1a1a2e",borderRadius:20,padding:18,border:"1px solid #2d2d4e",display:"flex",gap:14,flexWrap:"wrap",justifyContent:"center"}}>
      {badges.map(b=><BadgeItem key={b.id} {...b}/>)}
    </div>
  </div>
);

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App(){
  const [view,setView]   = useState("home");
  const [xp,setXp]       = useState(()=>load("sq_xp",120));
  const [level,setLevel] = useState(()=>load("sq_level",2));
  const [streak]         = useState(()=>load("sq_streak",5));
  const [courses,setCourses]         = useState(()=>load("sq_courses",[]));
  const [selectedCourse,setSelectedCourse] = useState(null);
  const [badges,setBadges] = useState(()=>load("sq_badges",[
    {id:1,emoji:"🌟",label:"Premier cours",unlocked:false},
    {id:2,emoji:"📷",label:"Photo analysée",unlocked:false},
    {id:3,emoji:"🏆",label:"Quiz parfait",unlocked:false},
    {id:4,emoji:"🔥",label:"7 jours streak",unlocked:false},
    {id:5,emoji:"📚",label:"5 cours créés",unlocked:false},
    {id:6,emoji:"⚡",label:"Calcul mental",unlocked:false},
  ]));

  // Persistance locale
  useEffect(()=>save("sq_xp",xp),[xp]);
  useEffect(()=>save("sq_level",level),[level]);
  useEffect(()=>save("sq_courses",courses),[courses]);
  useEffect(()=>save("sq_badges",badges),[badges]);

  const addXP=(amt)=>{
    setXp(prev=>{
      const next=prev+amt; const needed=level*100;
      if(next>=needed){setLevel(l=>l+1);return next-needed;}
      return next;
    });
  };

  const addCourse=(course)=>{
    setCourses(c=>[course,...c]);
    setBadges(b=>b.map(badge=>
      badge.id===1?{...badge,unlocked:true}:
      (badge.id===2&&course.analysis&&!course.analysis.error)?{...badge,unlocked:true}:
      badge
    ));
    addXP(50);
  };

  const NAV=[
    {id:"home",       emoji:"🏠",label:"Accueil"},
    {id:"courses",    emoji:"📚",label:"Cours"},
    {id:"quiz",       emoji:"🎯",label:"Quiz"},
    {id:"flashcards", emoji:"🃏",label:"Cartes"},
    {id:"games",      emoji:"🎮",label:"Jeux"},
    {id:"profile",    emoji:"👤",label:"Profil"},
  ];

  const renderView=()=>{
    if(view==="courses"&&selectedCourse)
      return <CourseDetail course={selectedCourse} onBack={()=>setSelectedCourse(null)} onXP={addXP}/>;
    switch(view){
      case "home":       return <HomeView       xp={xp} level={level} streak={streak} badges={badges} courses={courses} onNavigate={setView}/>;
      case "courses":    return <CoursesView    courses={courses} onAddCourse={addCourse} onViewCourse={setSelectedCourse}/>;
      case "quiz":       return <QuizView       onXP={addXP}/>;
      case "flashcards": return <FlashcardsView onXP={addXP}/>;
      case "games":      return <GamesView      onXP={addXP}/>;
      case "profile":    return <ProfileView    xp={xp} level={level} streak={streak} badges={badges} courses={courses}/>;
      default: return null;
    }
  };

  return(
    <div style={{maxWidth:430,margin:"0 auto",height:"100vh",background:"#0f0f23",display:"flex",flexDirection:"column",position:"relative"}}>
      {/* HEADER */}
      <div style={{background:"#0f0f23ee",backdropFilter:"blur(12px)",borderBottom:"1px solid #2d2d4e",padding:"14px 20px",display:"flex",alignItems:"center",gap:10,flexShrink:0,paddingTop:"calc(14px + env(safe-area-inset-top))"}}>
        <span style={{fontSize:22}}>🚀</span>
        <span style={{color:"#fff",fontWeight:800,fontSize:18,fontFamily:"'Fredoka One',cursive"}}>Study<span style={{color:"#a78bfa"}}>Quest</span></span>
        <span style={{marginLeft:"auto",background:"#F7B73122",color:"#F7B731",borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:700}}>⭐ {xp} XP</span>
      </div>

      {/* CONTENT */}
      <div style={{flex:1,overflowY:"auto",overscrollBehavior:"contain"}}>{renderView()}</div>

      {/* NAV */}
      <div style={{background:"#0f0f23ee",backdropFilter:"blur(16px)",borderTop:"1px solid #2d2d4e",display:"flex",padding:"8px 4px",paddingBottom:"calc(8px + env(safe-area-inset-bottom))",flexShrink:0}}>
        {NAV.map(n=>{
          const active=view===n.id;
          return(
            <button key={n.id} onClick={()=>{setView(n.id);setSelectedCourse(null);}} style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"4px 2px"}}>
              <div style={{fontSize:20,filter:active?"none":"grayscale(.6) opacity(.5)",transform:active?"scale(1.15)":"scale(1)",transition:"all .2s"}}>{n.emoji}</div>
              <span style={{fontSize:10,color:active?"#a78bfa":"#4a4a6a",fontWeight:active?800:600}}>{n.label}</span>
              {active&&<div style={{width:16,height:3,background:"#a78bfa",borderRadius:99}}/>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
// ─── SERVICE WORKER ───────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('✅ SW enregistré:', reg.scope))
      .catch(err => console.log('❌ SW erreur:', err));
  });
}

// ─── INSTALL PROMPT (Android Chrome) ─────────────────────────────────────────
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Afficher un bouton d'installation custom si besoin
});

// ─── BANNIÈRE IOS ─────────────────────────────────────────────────────────────
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isInStandalone = window.navigator.standalone === true;
const bannerShown = sessionStorage.getItem('sq_banner_shown');

if (isIOS && !isInStandalone && !bannerShown) {
  setTimeout(() => {
    const banner = document.getElementById('install-banner');
    if (banner) {
      banner.classList.add('visible');
      sessionStorage.setItem('sq_banner_shown', '1');
      setTimeout(() => banner.classList.remove('visible'), 8000);
    }
  }, 2000);
}

// ─── EMPÊCHER LE SCROLL BOUNCE iOS ────────────────────────────────────────────
document.addEventListener('touchmove', (e) => {
  if (e.target.closest('[style*="overflow-y: auto"]') ||
      e.target.closest('[style*="overflow-y:auto"]')) return;
  e.preventDefault();
}, { passive: false });
</script>
</body>
