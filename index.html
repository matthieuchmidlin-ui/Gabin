  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f0f23; overflow: hidden; }
    body {
      font-family: 'Nunito', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #root { height: 100%; }
    button { font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
    input, textarea, select { font-family: 'Nunito', sans-serif; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeIn  { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pop     { 0%{transform:scale(.85);opacity:0;} 70%{transform:scale(1.04);} 100%{transform:scale(1);opacity:1;} }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #6C63FF55; border-radius: 99px; }

    /* ── LAYOUT RESPONSIVE ────────────────────────────────────────── */

    /* iPhone : colonne pleine largeur */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 100%;
    }
    .app-sidebar  { display: none; }
    .app-body     { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .app-topbar   { flex-shrink: 0; }
    .app-content  { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    .app-bottomnav { flex-shrink: 0; }

    /* iPad portrait (≥ 768px) : 2 colonnes */
    @media (min-width: 768px) {
      .app-shell {
        flex-direction: row;
        height: 100%;
      }
      .app-sidebar {
        display: flex;
        flex-direction: column;
        width: 240px;
        min-width: 240px;
        background: #13132b;
        border-right: 1px solid #2d2d4e;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
        overflow-y: auto;
      }
      .app-body {
        flex: 1;
        overflow: hidden;
      }
      .app-topbar {
        padding-top: env(safe-area-inset-top);
      }
      .app-bottomnav { display: none; }
      .app-content {
        /* Sur iPad le contenu peut être plus large */
        padding-bottom: 24px;
      }
    }

    /* iPad landscape (≥ 1024px) : sidebar plus large + contenu 2 colonnes */
    @media (min-width: 1024px) {
      .app-sidebar { width: 260px; min-width: 260px; }
      /* Grilles 2 colonnes dans le contenu */
      .grid-2col  { display: grid !important; grid-template-columns: 1fr 1fr; gap: 16px; }
      .grid-3col  { display: grid !important; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    }

    /* Largeur max du contenu sur très grand écran */
    .content-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 8px;
    }

    #install-banner {

      background: linear-gradient(135deg,#6C63FF,#a78bfa);
      padding: 12px 16px; display: flex; align-items: center; gap: 12px;
      transform: translateY(-100%); transition: transform .4s ease;
    }
    #install-banner.visible { transform: translateY(0); }
  </style>
</head>

const fileToBase64 = f => new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>res({base64:r.result.split(",")[1],type:f.type||"image/jpeg",dataUrl:r.result});
  r.onerror=()=>rej(new Error("err"));
  r.readAsDataURL(f);
});

// ── Gestion clé API ────────────────────────────────────────────────────────
const getApiKey = () => {
  try { return localStorage.getItem('sq_api_key') || ''; } catch(e) { return ''; }
};
const setApiKey = (k) => {
  try { localStorage.setItem('sq_api_key', k.trim()); } catch(e) {}
};

const api = async (msgs, img=null) => {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("CLÉ_MANQUANTE");

  const content = img
    ? [{type:"image",source:{type:"base64",media_type:img.type,data:img.base64}},{type:"text",text:msgs}]
    : msgs;

  let r;
  try {
    r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      mode: "cors",
      cache: "no-store",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 2000,
        messages: [{role:"user", content}]
      })
    });
  } catch(netErr) {
    throw new Error("Réseau inaccessible. Vérifie ta connexion. (" + netErr.message + ")");
  }

  if (!r.ok) {
    const errText = await r.text().catch(()=>"");
    if (r.status === 401) {
      // Effacer la clé invalide pour forcer la reconfiguration
      try { localStorage.removeItem('sq_api_key'); } catch(e) {}
      throw new Error("CLÉ_INVALIDE");
    }
    throw new Error("Erreur API " + r.status + ": " + errText.slice(0,120));
  }

  const d = await r.json();
  if (d.error) throw new Error("Erreur Claude : " + d.error.message);
  return d.content?.[0]?.text || "";
};

const useIsTablet = () => {
  const [tablet, setTablet] = useState(window.innerWidth >= 768);
  useEffect(()=>{

    window.addEventListener('resize',h);
    return ()=>window.removeEventListener('resize',h);
  },[]);
  return tablet;
};

              <div style={{color:"#fff",fontWeight:700,fontSize:16}}>{a.label.slice(3)}</div>
              <div style={{color:"#7c7cac",fontSize:13,marginTop:2}}>{a.sub}</div>
            </div>
            <span style={{marginLeft:"auto",color:a.color,fontSize:20}}>›</span>

      <h3 style={{color:"#a78bfa",fontSize:12,letterSpacing:2,textTransform:"uppercase",margin:"0 0 14px",fontWeight:700}}>Mes Badges</h3>
      <div style={{background:"#1a1a2e",borderRadius:18,padding:20,border:"1px solid #2d2d4e",display:"flex",gap:18,flexWrap:"wrap",justifyContent:"center"}}>

);

// ─── COURSES ──────────────────────────────────────────────────────────────────
const CoursesView = ({courses,onAddCourse,onViewCourse,isTablet}) => {
  const [showForm,   setShowForm]   = useState(false);
  const [title,      setTitle]      = useState("");
  const [subject,    setSubject]    = useState("math");
  const [content,    setContent]    = useState("");
  // ── Multi-photos ──────────────────────────────────────────────────────────
  const [photos,     setPhotos]     = useState([]); // [{dataUrl,base64,type}]
  const [analyzing,  setAnalyzing]  = useState(false);
  const [analyzeProgress, setAnalyzeProgress] = useState(""); // message d'étape
  const [analysis,   setAnalysis]   = useState(null);
  const [aiError,    setAiError]    = useState("");
  const cameraRef  = useRef();
  const galleryRef = useRef();
  const fileDocRef = useRef();
  const [showPicker, setShowPicker] = useState(false);

  const reset=()=>{setTitle("");setContent("");setPhotos([]);setAnalysis(null);setAiError("");setSubject("math");setShowForm(false);setShowPicker(false);setAnalyzeProgress("");};

  // ── Extraction JSON robuste : tente plusieurs stratégies ──────────────────
  const extractJSON = (raw) => {
    // 1. Nettoyer les backticks markdown
    let s = raw.replace(/```json|```/gi,"").trim();
    // 2. Essai direct
    try{ return JSON.parse(s); }catch(e){}
    // 3. Extraire le premier objet JSON avec regex
    const m = s.match(/\{[\s\S]*\}/);
    if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
    // 4. Réparer les guillemets typographiques
    s = s.replace(/[""]/g,'"').replace(/['']/g,"'");
    try{ return JSON.parse(s); }catch(e){}
    return null;
  };

  // ── Ajout d'une ou plusieurs photos ──────────────────────────────────────
  const handleFiles = async (e) => {
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    e.target.value = "";
    setShowPicker(false);
    const newPhotos = [];
    for(const f of files){
      try{
        const info = await fileToBase64(f);
        newPhotos.push(info);
      }catch(err){ console.warn("fileToBase64 error",err); }
    }
    setPhotos(prev => [...prev, ...newPhotos]);
  };

  const removePhoto = (idx) => setPhotos(prev => prev.filter((_,i)=>i!==idx));

  // ── Analyse IA (supporte plusieurs photos) ────────────────────────────────
  const canAnalyze = photos.length > 0 || content.trim().length > 20 || title.trim().length > 3;

  const analyzeContent = async () => {
    if(!canAnalyze) return;
    setAnalyzing(true); setAnalysis(null); setAiError("");

    try{
      let raw = "";

      if(photos.length === 0) {
        // ── CAS 1 : Texte uniquement (pas de photo) ──────────────────────
        setAnalyzeProgress("🧠 Génération des activités depuis le texte...");
        const textContent = (title.trim() ? `Titre : ${title.trim()}\n\n` : "") + content.trim();
        const prompt = `Tu es un assistant pédagogique expert pour un élève de 5e (12 ans).
Voici un cours rédigé par l'élève :
---
${textContent}
---
Génère des activités pédagogiques adaptées à ce cours.
RÈGLE quiz : 1 question par notion/concept distinct. Min 4, max 10.
Réponds avec du JSON valide UNIQUEMENT. Commence DIRECTEMENT par { sans aucun texte avant ni après.
{
  "titre": "titre court du cours",
  "matiere": "math ou french ou history ou science ou english",
  "nb_questions": 6,
  "resume": "résumé clair en 2-3 phrases",
  "points_cles": ["notion 1", "notion 2", "notion 3"],
  "quiz": [{"q": "Question ?", "choices": ["A","B","C","D"], "answer": 0}],
  "flashcards": [{"front": "Question ?", "back": "Réponse"}],
  "jeu_vrai_faux": [{"affirmation": "Affirmation", "vrai": true}],
  "astuce_memo": "astuce mémo fun"
}`;
        raw = await api(prompt);

      } else if(photos.length === 1) {
        // ── CAS 2 : Une seule photo ───────────────────────────────────────
        setAnalyzeProgress("📖 Lecture de la photo...");
        const extraText = content.trim() ? `\nNotes supplémentaires de l'élève : ${content.trim()}` : "";
        const prompt = `Tu es un assistant pédagogique expert pour un élève de 5e (12 ans).
Analyse cette photo de cours scolaire et génère des activités pédagogiques.${extraText}
RÈGLE quiz : 1 question par notion/concept distinct. Min 4, max 10.
Réponds avec du JSON valide UNIQUEMENT. Commence DIRECTEMENT par { sans aucun texte avant ni après.
{
  "titre": "titre court du cours",
  "matiere": "math ou french ou history ou science ou english",
  "nb_questions": 6,
  "resume": "résumé clair en 2-3 phrases",
  "points_cles": ["notion 1", "notion 2", "notion 3"],
  "quiz": [{"q": "Question ?", "choices": ["A","B","C","D"], "answer": 0}],
  "flashcards": [{"front": "Question ?", "back": "Réponse"}],
  "jeu_vrai_faux": [{"affirmation": "Affirmation", "vrai": true}],
  "astuce_memo": "astuce mémo fun"
}`;
        raw = await api(prompt, photos[0]);

      } else {
        // ── CAS 3 : Plusieurs photos ──────────────────────────────────────
        const descriptions = [];
        for(let i=0; i<photos.length; i++){
          setAnalyzeProgress(`📖 Lecture page ${i+1}/${photos.length}...`);
          const desc = await api(
            `Transcris intégralement le contenu textuel de cette page de cours (page ${i+1}/${photos.length}). Recopie tous les titres, définitions, formules et exemples visibles. Ne résume pas.`,
            photos[i]
          );
          descriptions.push(`--- PAGE ${i+1} ---\n${desc}`);
        }
        setAnalyzeProgress("🧠 Génération des activités...");
        const combinedText = descriptions.join("\n\n");
        const extraText = content.trim() ? `\nNotes supplémentaires : ${content.trim()}` : "";
        const prompt = `Tu es un assistant pédagogique expert pour un élève de 5e (12 ans).
Voici le contenu complet du cours (${photos.length} pages) :
${combinedText}${extraText}

Génère des activités pédagogiques sur l'ensemble de ce cours.
RÈGLE quiz : 1 question par notion/concept distinct. Min 4, max 10.
Réponds avec du JSON valide UNIQUEMENT. Commence DIRECTEMENT par { sans aucun texte avant ni après.
{
  "titre": "titre court du cours",
  "matiere": "math ou french ou history ou science ou english",
  "nb_questions": 6,
  "resume": "résumé clair en 2-3 phrases",
  "points_cles": ["notion 1", "notion 2", "notion 3"],
  "quiz": [{"q": "Question ?", "choices": ["A","B","C","D"], "answer": 0}],
  "flashcards": [{"front": "Question ?", "back": "Réponse"}],
  "jeu_vrai_faux": [{"affirmation": "Affirmation", "vrai": true}],
  "astuce_memo": "astuce mémo fun"
}`;
        raw = await api(prompt);
      }

      const parsed = extractJSON(raw);
      if(!parsed) throw new Error("Réponse non JSON : " + raw.slice(0,200));

      setAnalysis(parsed);
      if(parsed.titre && !title.trim()) setTitle(parsed.titre);
      if(parsed.matiere && SUBJECTS.find(s=>s.id===parsed.matiere)) setSubject(parsed.matiere);
      if(parsed.resume && !content.trim()) setContent(
        parsed.resume +
        (parsed.points_cles?.length ? "\n\n📌 Points clés :\n"+parsed.points_cles.map(p=>"• "+p).join("\n") : "")
      );

    } catch(err){
      console.error("Analyse IA:", err);
      if(err.message==="CLÉ_MANQUANTE"||err.message==="CLÉ_INVALIDE"){
        setAiError("CLÉ_KO");
      } else {
        setAiError("Analyse échouée.\nDétail : " + err.message);
      }
    }
    setAnalyzing(false);
    setAnalyzeProgress("");
  };

  const handleSave=()=>{
    if(!title.trim()) return;
    onAddCourse({
      id: Date.now(),
      title: title.trim(), subject, content,
      imgDataUrl: photos[0]?.dataUrl || null, // première photo pour la vignette
      photos: photos.map(p=>p.dataUrl),       // toutes les photos
      analysis,
      date: new Date().toLocaleDateString("fr-FR")
    });
    reset();
  };

  const getS=(id)=>SUBJECTS.find(s=>s.id===id)||SUBJECTS[0];

  return(
    <div style={{padding:"20px 20px 32px",animation:"fadeIn .3s ease"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
        <div>
          <h2 style={{color:"#fff",margin:0,fontSize:22,fontFamily:"'Fredoka One',cursive"}}>📚 Mes Cours</h2>
          {isTablet&&<p style={{color:"#7c7cac",fontSize:13,margin:"4px 0 0"}}>Photos → activités IA générées automatiquement</p>}
        </div>
        <button onClick={()=>setShowForm(v=>!v)} style={{background:"linear-gradient(135deg,#6C63FF,#a78bfa)",border:"none",borderRadius:12,padding:"10px 20px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:14}}>
          {showForm?"✕ Fermer":"+ Ajouter"}
        </button>
      </div>

      {showForm&&(
        <div style={{background:"#1a1a2e",borderRadius:20,padding:24,border:"1px solid #6C63FF44",marginBottom:24,animation:"fadeIn .2s ease"}}>
          <h3 style={{color:"#a78bfa",margin:"0 0 18px",fontSize:16}}>📷 Nouveau cours</h3>

          <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
            <div style={{flex:"1 1 280px"}}>

              {/* ── 3 INPUTS cachés (multiple pour galerie/fichier) ── */}
              <input ref={cameraRef}  type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handleFiles}/>
              <input ref={galleryRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={handleFiles}/>
              <input ref={fileDocRef} type="file" accept="image/*,image/heic,image/heif" multiple style={{display:"none"}} onChange={handleFiles}/>

              {/* ── Grille des photos ajoutées ── */}
              {photos.length > 0 && (
                <div style={{marginBottom:14}}>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(90px,1fr))",gap:8,marginBottom:10}}>
                    {photos.map((p,i)=>(
                      <div key={i} style={{position:"relative",borderRadius:10,overflow:"hidden",aspectRatio:"1",border:"2px solid #43B89C44"}}>
                        <img src={p.dataUrl} alt={`page ${i+1}`} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                        <div style={{position:"absolute",top:0,left:0,right:0,background:"#00000088",padding:"2px 0",textAlign:"center"}}>
                          <span style={{color:"#fff",fontSize:10,fontWeight:700}}>P.{i+1}</span>
                        </div>
                        <button onClick={()=>removePhoto(i)} style={{position:"absolute",top:2,right:2,background:"#FF658488",border:"none",borderRadius:"50%",width:20,height:20,cursor:"pointer",color:"#fff",fontSize:11,lineHeight:"20px",padding:0}}>✕</button>
                      </div>
                    ))}
                    {/* Bouton + pour ajouter d'autres photos */}
                    <button onClick={()=>setShowPicker(p=>!p)} style={{aspectRatio:"1",borderRadius:10,background:"#16163a",border:"2px dashed #6C63FF55",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,color:"#6C63FF"}}>
                      <span style={{fontSize:22}}>+</span>
                      <span style={{fontSize:10,fontWeight:700}}>Page</span>
                    </button>
                  </div>
                  <p style={{color:"#7c7cac",fontSize:11,margin:"0 0 10px",textAlign:"center"}}>
                    {photos.length} page{photos.length>1?"s":""} · Glisse pour réordonner
                  </p>
                </div>
              )}

              {/* ── Bouton principal si aucune photo ── */}
              {photos.length === 0 && (
                <button onClick={()=>setShowPicker(p=>!p)} style={{width:"100%",padding:"24px 16px",marginBottom:10,background:"#16163a",border:"2px dashed #6C63FF",borderRadius:14,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:8,color:"#a78bfa"}}>
                  <span style={{fontSize:40}}>📷</span>
                  <span style={{fontWeight:700,fontSize:14}}>Ajouter les photos du cours</span>
                  <span style={{fontSize:12,color:"#7c7cac"}}>1 ou plusieurs pages · L'IA analyse tout</span>
                </button>
              )}

              {/* ── PICKER 3 options ── */}
              {showPicker&&(
                <div style={{background:"#0f0f23",border:"1px solid #6C63FF55",borderRadius:14,overflow:"hidden",marginBottom:14,animation:"fadeIn .15s ease"}}>
                  {[
                    {icon:"📸", label:"Prendre une photo",    sub:"Caméra — une page à la fois", ref:cameraRef},
                    {icon:"🖼️", label:"Photothèque",          sub:"Sélectionner 1 ou plusieurs",  ref:galleryRef},
                    {icon:"📁", label:"Fichiers",              sub:"Depuis iCloud, Drive...",       ref:fileDocRef},
                  ].map((opt,i,arr)=>(
                    <button key={opt.label} onClick={()=>opt.ref.current?.click()}
                      style={{width:"100%",background:"none",border:"none",borderBottom:i<arr.length-1?"1px solid #2d2d4e":"none",padding:"14px 18px",cursor:"pointer",display:"flex",alignItems:"center",gap:14,textAlign:"left"}}
                      onMouseEnter={e=>e.currentTarget.style.background="#1a1a2e"}
                      onMouseLeave={e=>e.currentTarget.style.background="none"}
                    >
                      <span style={{fontSize:26,flexShrink:0}}>{opt.icon}</span>
                      <div>
                        <div style={{color:"#fff",fontWeight:700,fontSize:14}}>{opt.label}</div>
                        <div style={{color:"#7c7cac",fontSize:12,marginTop:2}}>{opt.sub}</div>
                      </div>
                      <span style={{marginLeft:"auto",color:"#4a4a6a",fontSize:18}}>›</span>
                    </button>
                  ))}
                  <button onClick={()=>setShowPicker(false)} style={{width:"100%",background:"none",border:"none",borderTop:"1px solid #2d2d4e",padding:"12px",color:"#7c7cac",cursor:"pointer",fontSize:13,fontWeight:600}}>Annuler</button>
                </div>
              )}

              {/* ── Bouton Analyser — visible si photo OU texte saisi ── */}
              {canAnalyze && !analysis && !analyzing && (
                <button onClick={analyzeContent} style={{width:"100%",background:"linear-gradient(135deg,#43B89C,#2dd4bf)",border:"none",borderRadius:12,padding:"14px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:14,marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  <span>✨</span>
                  <span>
                    {photos.length > 1 ? `Analyser les ${photos.length} pages` :
                     photos.length === 1 ? "Analyser la photo" :
                     "Générer quiz & activités depuis le texte"}
                  </span>
                </button>
              )}

              {/* ── Progression ── */}
              {analyzing && (
                <div style={{textAlign:"center",padding:"16px 0"}}>
                  <div style={{fontSize:28,animation:"spin 1s linear infinite",display:"inline-block"}}>⚙️</div>
                  <p style={{color:"#a78bfa",fontSize:13,marginTop:8,fontWeight:600}}>{analyzeProgress||"Analyse en cours..."}</p>
                </div>
              )}

              {/* ── Résultat analyse ── */}
              {analysis && !aiError && (
                <div style={{background:"#0a2018",border:"1px solid #43B89C55",borderRadius:12,padding:14,marginBottom:10}}>
                  <p style={{color:"#43B89C",fontWeight:700,margin:"0 0 8px",fontSize:14}}>✨ Cours analysé !</p>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <span style={{background:"#6C63FF22",color:"#a78bfa",borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:700}}>🎯 {analysis.nb_questions} questions</span>
                    <span style={{background:"#43B89C22",color:"#43B89C",borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:700}}>🃏 {analysis.flashcards?.length} cartes</span>
                    <span style={{background:"#F7B73122",color:"#F7B731",borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:700}}>⚡ {analysis.jeu_vrai_faux?.length} vrai/faux</span>
                  </div>
                  {analysis.astuce_memo&&<p style={{color:"#a78bfa",fontSize:12,margin:"8px 0 0",fontStyle:"italic"}}>💡 {analysis.astuce_memo}</p>}
                  <button onClick={analyzeContent} style={{marginTop:10,background:"none",border:"1px solid #43B89C44",borderRadius:8,padding:"5px 12px",color:"#43B89C",cursor:"pointer",fontSize:12}}>🔄 Relancer l'analyse</button>
                </div>
              )}

              {/* ── Erreur ── */}
              {aiError && (
                aiError === "CLÉ_KO" ? (
                  <div style={{background:"#200a0a",border:"1px solid #FF658455",borderRadius:12,padding:16,marginBottom:10,textAlign:"center"}}>
                    <div style={{fontSize:32,marginBottom:8}}>🔑</div>
                    <p style={{color:"#FF6584",fontSize:14,margin:"0 0 6px",fontWeight:700}}>Clé API invalide ou expirée</p>
                    <p style={{color:"#FF658488",fontSize:12,margin:"0 0 14px"}}>Va sur console.anthropic.com pour générer une nouvelle clé.</p>
                    <button onClick={()=>{try{localStorage.removeItem('sq_api_key');}catch(e){}window.location.reload();}} style={{background:"linear-gradient(135deg,#6C63FF,#a78bfa)",border:"none",borderRadius:10,padding:"10px 20px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13,width:"100%"}}>
                      ⚙️ Reconfigurer la clé API
                    </button>
                  </div>
                ) : (
                  <div style={{background:"#200a0a",border:"1px solid #FF658455",borderRadius:12,padding:14,marginBottom:10}}>
                    <p style={{color:"#FF6584",fontSize:13,margin:"0 0 8px",fontWeight:700}}>❌ Analyse échouée</p>
                    <p style={{color:"#FF658488",fontSize:12,margin:"0 0 10px",lineHeight:1.5,whiteSpace:"pre-wrap"}}>{aiError}</p>
                    <button onClick={analyzeContent} style={{background:"none",border:"1px solid #FF658455",borderRadius:8,padding:"6px 14px",color:"#FF6584",cursor:"pointer",fontSize:12,fontWeight:700}}>🔄 Réessayer</button>
                  </div>
                )
              )}
            </div>

            <div style={{flex:"1 1 280px",display:"flex",flexDirection:"column",gap:10}}>
              <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Titre du cours..."
                style={{width:"100%",background:"#0f0f23",border:"1px solid #2d2d4e",borderRadius:10,padding:"12px 16px",color:"#fff",fontSize:15,outline:"none"}}/>
              <select value={subject} onChange={e=>setSubject(e.target.value)}
                style={{width:"100%",background:"#0f0f23",border:"1px solid #2d2d4e",borderRadius:10,padding:"12px 16px",color:"#fff",fontSize:15,outline:"none"}}>
                {SUBJECTS.map(s=><option key={s.id} value={s.id}>{s.emoji} {s.label}</option>)}
              </select>
              <textarea value={content} onChange={e=>setContent(e.target.value)} placeholder="Notes ou résumé (auto-rempli après analyse)..." rows={isTablet?6:4}
                style={{width:"100%",background:"#0f0f23",border:"1px solid #2d2d4e",borderRadius:10,padding:"12px 16px",color:"#fff",fontSize:14,outline:"none",resize:"vertical",fontFamily:"inherit",flex:1}}/>
              <div style={{display:"flex",gap:10}}>
                <button onClick={handleSave} disabled={!title.trim()} style={{flex:1,background:title.trim()?"linear-gradient(135deg,#6C63FF,#a78bfa)":"#2d2d4e",border:"none",borderRadius:12,padding:14,color:"#fff",fontWeight:700,cursor:title.trim()?"pointer":"not-allowed",fontSize:15}}>💾 Enregistrer</button>
                <button onClick={reset} style={{background:"#2d2d4e",border:"none",borderRadius:12,padding:"14px 20px",color:"#7c7cac",cursor:"pointer"}}>Annuler</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {courses.length===0&&!showForm&&(
        <div style={{textAlign:"center",padding:"80px 20px",color:"#7c7cac"}}>
          <div style={{fontSize:64,marginBottom:16}}>📷</div>
          <p style={{fontSize:16,lineHeight:1.7}}>Prends une photo de ton cours<br/>L'IA adapte le quiz à la densité du contenu !</p>
        </div>
      )}

      {/* Grille cours — 2 colonnes sur iPad */}
      <div className="grid-2col" style={{display:"flex",flexDirection:"column",gap:14}}>
        {courses.map(c=>{
          const sv=getS(c.subject);
          return(
            <button key={c.id} onClick={()=>onViewCourse(c)} style={{background:"#1a1a2e",border:`1px solid ${sv.color}44`,borderRadius:18,padding:0,cursor:"pointer",overflow:"hidden",textAlign:"left",display:"block",width:"100%",transition:"border-color .2s"}}
              onMouseEnter={e=>e.currentTarget.style.borderColor=sv.color}
              onMouseLeave={e=>e.currentTarget.style.borderColor=`${sv.color}44`}
            >
              {c.imgDataUrl&&<img src={c.imgDataUrl} alt="" style={{width:"100%",height:140,objectFit:"cover"}}/>}
              <div style={{padding:"16px 18px"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
                  <span style={{background:`${sv.color}22`,color:sv.color,borderRadius:8,padding:"3px 10px",fontSize:12,fontWeight:700}}>{sv.emoji} {sv.label}</span>
                  {c.analysis&&<span style={{background:"#6C63FF22",color:"#a78bfa",borderRadius:8,padding:"3px 8px",fontSize:11,fontWeight:700}}>🎯 {c.analysis.nb_questions}Q</span>}
                  <span style={{color:"#7c7cac",fontSize:11,marginLeft:"auto"}}>{c.date}</span>
                </div>
                <h4 style={{color:"#fff",margin:0,fontSize:16}}>{c.title}</h4>
                {c.content&&<p style={{color:"#7c7cac",fontSize:13,margin:"6px 0 0",lineHeight:1.5}}>{c.content.slice(0,100)}{c.content.length>100?"...":""}</p>}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
};

// ─── COURSE DETAIL ────────────────────────────────────────────────────────────
const CourseDetail = ({course,onBack,onXP,onRecordAnswer,onRecordVF,onRecordCard,onUpdateCourse,isTablet}) => {
  const sv=SUBJECTS.find(s=>s.id===course.subject)||SUBJECTS[0];
  const [localAnalysis,setLocalAnalysis]=useState(course.analysis||null);
  const ar=localAnalysis; const hasAI=ar&&!ar.error&&ar.quiz?.length>0;
  const TABS=[
    {id:"resume",label:"📋 Résumé"},
    ...(hasAI&&ar.quiz?.length?[{id:"quiz",label:`🎯 Quiz (${ar.quiz.length}Q)`}]:[]),
    ...(hasAI&&ar.flashcards?.length?[{id:"flash",label:"🃏 Cartes"}]:[]),
    ...(hasAI&&ar.jeu_vrai_faux?.length?[{id:"vf",label:"⚡ Vrai/Faux"}]:[]),
    {id:"bilan",label:"✨ Bilan IA"},
  ];
  const [tab,setTab]=useState("resume");
  const [qIdx,setQIdx]=useState(0);const [qSel,setQSel]=useState(null);const [qScore,setQScore]=useState(0);const [qDone,setQDone]=useState(false);
  const [fIdx,setFIdx]=useState(0);const [fFlip,setFFlip]=useState(false);
  const [vIdx,setVIdx]=useState(0);const [vScore,setVScore]=useState(0);const [vDone,setVDone]=useState(false);const [vFeed,setVFeed]=useState(null);
  const [bilan,setBilan]=useState("");const [bilanLoad,setBilanLoad]=useState(false);
  const [generating,setGenerating]=useState(false);const [genError,setGenError]=useState("");

  const q=hasAI?ar.quiz:[];const fc=hasAI?ar.flashcards:[];const vf=hasAI?ar.jeu_vrai_faux:[];

  const handleQ=(i)=>{if(qSel!==null)return;setQSel(i);const ok=i===q[qIdx].answer;if(ok)setQScore(s=>s+1);if(onRecordAnswer)onRecordAnswer(sv.id,ok);else if(ok)onXP(10);setTimeout(()=>{if(qIdx+1<q.length){setQIdx(x=>x+1);setQSel(null);}else setQDone(true);},1100);};
  const handleVF=(ans)=>{const ok=ans===vf[vIdx].vrai;setVFeed(ok);if(ok)setVScore(s=>s+1);if(onRecordVF)onRecordVF(sv.id,ok);else if(ok)onXP(8);setTimeout(()=>{if(vIdx+1<vf.length){setVIdx(x=>x+1);setVFeed(null);}else setVDone(true);},1000);};
  const genBilan=async()=>{setBilanLoad(true);const txt=await api(`Prof bienveillant pour élève de 5e. Cours : "${course.title}" (${sv.label}). ${course.content||""}. ${hasAI?"Points clés : "+ar.points_cles?.join(", "):""}. Bilan motivant avec emojis : 1. 📌 Essentiel (3 bullets) 2. 💡 Exemple concret 3. ⚡ Astuce mémo fun 4. 🌟 Encouragement. Max 200 mots.`);setBilan(txt);setBilanLoad(false);onXP(15);};

  const generateActivities=async()=>{
    setGenerating(true);setGenError("");
    try{
      const courseText=(course.title?"Titre : "+course.title+"\nMatiè re : "+sv.label+"\n\n":"")+(course.content||"");
      const raw=await api("Tu es assistant pédagogique pour élève de 5e. Cours:\n"+courseText+"\nGénère des activités. Réponds JSON uniquement, commence par {.\n{\"titre\":\""+course.title+"\",\"matiere\":\""+sv.id+"\",\"nb_questions\":6,\"resume\":\"2-3 phrases\",\"points_cles\":[\"p1\",\"p2\",\"p3\"],\"quiz\":[{\"q\":\"Q?\",\"choices\":[\"A\",\"B\",\"C\",\"D\"],\"answer\":0}],\"flashcards\":[{\"front\":\"Q?\",\"back\":\"R\"}],\"jeu_vrai_faux\":[{\"affirmation\":\"A\",\"vrai\":true}],\"astuce_memo\":\"astuce\"}");
      let parsed=null;
      const clean=raw.replace(/```json|```/gi,"").trim();
      try{parsed=JSON.parse(clean);}catch(e){const m=clean.match(/\{[\s\S]*\}/);if(m)try{parsed=JSON.parse(m[0]);}catch(e2){}}
      if(!parsed||!parsed.quiz?.length)throw new Error("Réponse invalide");
      setLocalAnalysis(parsed);
      if(onUpdateCourse)onUpdateCourse(course.id,parsed);
      setTab("quiz");onXP(20);
    }catch(err){
      if(err.message==="CLÉ_MANQUANTE"||err.message==="CLÉ_INVALIDE"){
        setGenError("CLÉ_KO");
      } else {
        setGenError(err.message);
      }
    }
    setGenerating(false);
  };

  const pctQ=q.length>0?Math.round((qScore/q.length)*100):0;

  return(
    <div style={{padding:"20px 20px 32px",animation:"fadeIn .3s ease"}}>
      <button onClick={onBack} style={{background:"none",border:"none",color:"#a78bfa",cursor:"pointer",fontSize:15,marginBottom:14,padding:0,display:"flex",alignItems:"center",gap:6}}>← Retour</button>

      {/* Sur iPad : layout 2 colonnes (image + infos) */}
      <div style={{display:"flex",gap:20,flexWrap:"wrap",marginBottom:20}}>
        {course.imgDataUrl&&(
          <img src={course.imgDataUrl} alt="" style={{borderRadius:16,objectFit:"cover",border:"1px solid #2d2d4e",width:isTablet?"320px":"100%",maxHeight:220,flexShrink:0}}/>
        )}
        <div style={{flex:1,minWidth:220}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
            <span style={{background:`${sv.color}22`,color:sv.color,borderRadius:8,padding:"3px 12px",fontSize:13,fontWeight:700}}>{sv.emoji} {sv.label}</span>
            {hasAI&&<QBadge n={q.length}/>}
          </div>
          <h2 style={{color:"#fff",fontSize:isTablet?26:20,margin:"0 0 12px"}}>{course.title}</h2>
          {hasAI&&ar.astuce_memo&&(
            <div style={{background:"#6C63FF22",border:"1px solid #6C63FF33",borderRadius:12,padding:"10px 14px"}}>
              <span style={{color:"#a78bfa",fontSize:13}}>💡 {ar.astuce_memo}</span>
            </div>
          )}
        </div>
      </div>

      {/* TABS */}
      <div style={{display:"flex",gap:8,overflowX:"auto",marginBottom:20,paddingBottom:4}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{background:tab===t.id?"linear-gradient(135deg,#6C63FF,#a78bfa)":"#1a1a2e",border:tab===t.id?"none":"1px solid #2d2d4e",borderRadius:22,padding:"8px 18px",color:tab===t.id?"#fff":"#7c7cac",cursor:"pointer",fontSize:13,fontWeight:700,whiteSpace:"nowrap",flexShrink:0}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* Contenu limité en largeur sur grand écran */}
      <div style={{maxWidth:isTablet?700:"100%"}}>

        {tab==="resume"&&(
          <div>
            {hasAI&&(
              <div style={{background:"#0a2018",border:"1px solid #43B89C33",borderRadius:16,padding:20,marginBottom:16}}>
                <p style={{color:"#43B89C",fontWeight:700,margin:"0 0 12px",fontSize:15}}>📌 Points clés</p>
                {ar.points_cles?.map((p,i)=><div key={i} style={{display:"flex",gap:10,marginBottom:8}}><span style={{color:"#43B89C",flexShrink:0}}>•</span><span style={{color:"#c5c5e0",fontSize:14,lineHeight:1.6}}>{p}</span></div>)}
              </div>
            )}
            {course.content&&<div style={{background:"#1a1a2e",borderRadius:16,padding:20,border:"1px solid #2d2d4e",color:"#c5c5e0",fontSize:14,lineHeight:1.8,whiteSpace:"pre-wrap",marginBottom:16}}>{course.content}</div>}

            {/* ── Bouton générer si pas encore d'activités ── */}
            {!hasAI && !generating && (
              <div style={{background:"#1a1a2e",borderRadius:16,padding:20,border:"1px solid #6C63FF33",textAlign:"center"}}>
                <div style={{fontSize:40,marginBottom:10}}>🎯</div>
                <p style={{color:"#c5c5e0",fontSize:14,margin:"0 0 16px"}}>Ce cours n'a pas encore de quiz ni d'activités.</p>
                <button onClick={generateActivities} style={{background:"linear-gradient(135deg,#6C63FF,#a78bfa)",border:"none",borderRadius:12,padding:"13px 24px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:15,width:"100%"}}>
                  ✨ Générer quiz & activités avec l'IA
                </button>
                {genError && (
                  genError.includes("CLÉ") || genError.includes("401") ? (
                    <div style={{marginTop:12,background:"#200a0a",border:"1px solid #FF658444",borderRadius:10,padding:14,textAlign:"center"}}>
                      <p style={{color:"#FF6584",fontSize:13,margin:"0 0 10px",fontWeight:700}}>🔑 Clé API invalide ou expirée</p>
                      <button onClick={()=>{try{localStorage.removeItem('sq_api_key');}catch(e){}window.location.reload();}} style={{background:"linear-gradient(135deg,#6C63FF,#a78bfa)",border:"none",borderRadius:10,padding:"8px 18px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13}}>
                        ⚙️ Reconfigurer la clé
                      </button>
                    </div>
                  ) : (
                    <div style={{marginTop:10}}>
                      <p style={{color:"#FF6584",fontSize:12,margin:"0 0 8px"}}>{genError}</p>
                      <button onClick={generateActivities} style={{background:"none",border:"1px solid #FF658455",borderRadius:8,padding:"5px 12px",color:"#FF6584",cursor:"pointer",fontSize:12}}>🔄 Réessayer</button>
                    </div>
                  )
                )}
              </div>
            )}
            {generating&&(
              <div style={{textAlign:"center",padding:"24px",background:"#1a1a2e",borderRadius:16,border:"1px solid #6C63FF33"}}>
                <div style={{fontSize:28,animation:"spin 1s linear infinite",display:"inline-block"}}>⚙️</div>
                <p style={{color:"#a78bfa",fontSize:13,marginTop:8}}>Génération du quiz et des activités...</p>
              </div>
            )}
          </div>
        )}

        {tab==="quiz"&&q.length>0&&(
          qDone?(
            <div style={{textAlign:"center",padding:"40px 0",animation:"pop .4s ease"}}>
              <div style={{fontSize:64,marginBottom:12}}>{pctQ===100?"🏆":pctQ>=75?"🌟":pctQ>=50?"💪":"📚"}</div>
              <h3 style={{color:"#fff",fontSize:28,fontFamily:"'Fredoka One',cursive",margin:"0 0 6px"}}>{pctQ===100?"Parfait !":pctQ>=75?"Très bien !":pctQ>=50?"Pas mal !":"Continue !"}</h3>
              <p style={{color:"#a78bfa",fontSize:28,fontWeight:700,margin:"0 0 4px"}}>{qScore}/{q.length}</p>
              <p style={{color:"#7c7cac",margin:"0 0 24px"}}>{pctQ}% de réussite</p>
              <div style={{height:12,background:"#2d2d4e",borderRadius:99,marginBottom:28,overflow:"hidden",maxWidth:400,margin:"0 auto 28px"}}>
                <div style={{width:`${pctQ}%`,height:"100%",background:pctQ>=75?"linear-gradient(90deg,#43B89C,#2dd4bf)":pctQ>=50?"linear-gradient(90deg,#F7B731,#ffd43b)":"linear-gradient(90deg,#FF6584,#ff8fab)",borderRadius:99,transition:"width .8s"}}/>
              </div>
              <button onClick={()=>{setQIdx(0);setQSel(null);setQScore(0);setQDone(false);}} style={{background:"linear-gradient(135deg,#6C63FF,#a78bfa)",border:"none",borderRadius:14,padding:"14px 36px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:16}}>Recommencer</button>
            </div>
          ):(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <span style={{color:"#7c7cac",fontSize:14}}>Question {qIdx+1} / {q.length}</span>
                <QBadge n={q.length}/>
                <span style={{color:"#a78bfa",fontWeight:700,fontSize:16}}>⭐ {qScore}</span>
              </div>
              <div style={{height:8,background:"#2d2d4e",borderRadius:99,marginBottom:22,overflow:"hidden"}}>
                <div style={{width:`${((qIdx+1)/q.length)*100}%`,height:"100%",background:"linear-gradient(90deg,#6C63FF,#a78bfa)",borderRadius:99,transition:"width .4s"}}/>
              </div>
              <div style={{background:"#1a1a2e",borderRadius:20,padding:"28px 24px",border:"1px solid #2d2d4e",textAlign:"center",marginBottom:20}}>
                <p style={{color:"#fff",fontSize:isTablet?20:17,fontWeight:700,margin:0,lineHeight:1.5}}>{q[qIdx].q}</p>
              </div>
              {/* Sur iPad : choix en 2x2 */}
              <div className="grid-2col" style={{display:"flex",flexDirection:"column",gap:12}}>
                {q[qIdx].choices.map((c,i)=>{
                  let bg="#1a1a2e",border="1px solid #2d2d4e",col="#fff";
                  if(qSel!==null){if(i===q[qIdx].answer){bg="#0d2b22";border="1px solid #43B89C";col="#43B89C";}else if(i===qSel){bg="#2b0d0d";border="1px solid #FF6584";col="#FF6584";}}
                  return <button key={i} onClick={()=>handleQ(i)} style={{background:bg,border,borderRadius:14,padding:"14px 18px",color:col,fontWeight:600,fontSize:15,cursor:"pointer",textAlign:"left",transition:"all .3s",width:"100%"}}><span style={{opacity:.5,marginRight:10}}>{["A","B","C","D"][i]}.</span>{c}</button>;
                })}
              </div>
            </div>
          )
        )}

        {tab==="flash"&&fc.length>0&&(
          fIdx>=fc.length?(
            <div style={{textAlign:"center",padding:"40px 0",animation:"pop .4s ease"}}>
              <div style={{fontSize:64}}>🎉</div>
              <h3 style={{color:"#fff",fontFamily:"'Fredoka One',cursive",fontSize:28,marginBottom:20}}>Toutes vues !</h3>
              <button onClick={()=>{setFIdx(0);setFFlip(false);onXP(20);}} style={{background:"linear-gradient(135deg,#43B89C,#2dd4bf)",border:"none",borderRadius:14,padding:"14px 36px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:16}}>Recommencer (+20 XP)</button>
            </div>
          ):(
            <div>
              <div style={{textAlign:"right",color:"#7c7cac",fontSize:13,marginBottom:14}}>{fIdx+1}/{fc.length}</div>
              <div onClick={()=>setFFlip(f=>!f)} style={{minHeight:isTablet?260:200,background:fFlip?`${sv.color}11`:"#1a1a2e",border:`2px solid ${fFlip?sv.color+"88":"#2d2d4e"}`,borderRadius:24,padding:"36px 28px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",marginBottom:20,transition:"all .4s"}}>
                <div style={{fontSize:36,marginBottom:12}}>{fFlip?"💡":"❓"}</div>
                <p style={{color:fFlip?sv.color:"#fff",fontSize:isTablet?20:16,fontWeight:fFlip?500:700,margin:0,lineHeight:1.6}}>{fFlip?fc[fIdx].back:fc[fIdx].front}</p>
                {!fFlip&&<p style={{color:"#7c7cac",fontSize:13,marginTop:16}}>Touche pour voir la réponse</p>}
              </div>
              {fFlip&&<div style={{display:"flex",gap:12}}>
                <button onClick={()=>{setFIdx(i=>i+1);setFFlip(false);onXP(5);}} style={{flex:1,background:"#0d2b22",border:"1px solid #43B89C",borderRadius:14,padding:15,color:"#43B89C",fontWeight:700,cursor:"pointer",fontSize:15}}>✅ Compris !</button>
                <button onClick={()=>{setFIdx(i=>i+1);setFFlip(false);}} style={{flex:1,background:"#2b0d0d",border:"1px solid #FF6584",borderRadius:14,padding:15,color:"#FF6584",fontWeight:700,cursor:"pointer",fontSize:15}}>🔄 À revoir</button>
              </div>}
            </div>
          )
        )}

        {tab==="vf"&&vf.length>0&&(
          vDone?(
            <div style={{textAlign:"center",padding:"40px 0",animation:"pop .4s ease"}}>
              <div style={{fontSize:64}}>{vScore>=vf.length?"🏆":"💪"}</div>
              <h3 style={{color:"#fff",fontFamily:"'Fredoka One',cursive",fontSize:28}}>{vScore}/{vf.length}</h3>
              <button onClick={()=>{setVIdx(0);setVScore(0);setVDone(false);setVFeed(null);}} style={{background:"linear-gradient(135deg,#F7B731,#ffd43b)",border:"none",borderRadius:14,padding:"14px 36px",color:"#1a1a2e",fontWeight:700,cursor:"pointer",marginTop:20,fontSize:16}}>Recommencer</button>
            </div>
          ):(
            <div>
              <div style={{textAlign:"right",color:"#7c7cac",fontSize:13,marginBottom:16}}>{vIdx+1}/{vf.length} · ⭐ {vScore}</div>
              <div style={{background:"#1a1a2e",borderRadius:22,padding:"36px 28px",border:"1px solid #2d2d4e",textAlign:"center",marginBottom:24}}>
                <p style={{color:"#fff",fontSize:isTablet?22:17,fontWeight:700,margin:0,lineHeight:1.5}}>{vf[vIdx].affirmation}</p>
              </div>
              {vFeed!==null
                ?<div style={{textAlign:"center",fontSize:28,fontWeight:700,color:vFeed?"#43B89C":"#FF6584",padding:20,animation:"pop .3s ease"}}>{vFeed?"✅ Bravo !":"❌ Pas cette fois !"}</div>
                :<div style={{display:"flex",gap:14}}>
                  <button onClick={()=>handleVF(true)} style={{flex:1,background:"#0d2b22",border:"2px solid #43B89C",borderRadius:18,padding:20,color:"#43B89C",fontWeight:800,fontSize:20,cursor:"pointer"}}>✅ VRAI</button>
                  <button onClick={()=>handleVF(false)} style={{flex:1,background:"#2b0d0d",border:"2px solid #FF6584",borderRadius:18,padding:20,color:"#FF6584",fontWeight:800,fontSize:20,cursor:"pointer"}}>❌ FAUX</button>
                </div>
              }
            </div>
          )
        )}

        {tab==="bilan"&&(
          <div>
            {!bilan&&!bilanLoad&&(
              <div style={{textAlign:"center",padding:"40px 0"}}>
                <div style={{fontSize:56,marginBottom:14}}>✨</div>
                <p style={{color:"#7c7cac",marginBottom:24,fontSize:15}}>L'IA génère un bilan de révision personnalisé.</p>
                <button onClick={genBilan} style={{background:"linear-gradient(135deg,#43B89C,#2dd4bf)",border:"none",borderRadius:14,padding:"16px 36px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:16}}>Générer mon bilan</button>
              </div>
            )}
            {bilanLoad&&<Spinner text="Génération du bilan..."/>}
            {bilan&&!bilanLoad&&(
              <div style={{background:"#0a2018",border:"1px solid #43B89C44",borderRadius:18,padding:24}}>
                <h3 style={{color:"#43B89C",margin:"0 0 16px",fontSize:17}}>📋 Bilan de Révision</h3>
                <div style={{color:"#c5c5e0",fontSize:15,lineHeight:1.9,whiteSpace:"pre-wrap"}}>{bilan}</div>
                <button onClick={()=>setBilan("")} style={{marginTop:16,background:"none",border:"1px solid #2d2d4e",borderRadius:10,padding:"8px 18px",color:"#7c7cac",cursor:"pointer",fontSize:13}}>🔄 Régénérer</button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
const QuizView = ({onXP,onRecordAnswer,isTablet}) => {
  const [step,setStep]=useState("choose");const [sel,setSel]=useState(null);
  const [qs,setQs]=useState([]);const [cur,setCur]=useState(0);const [chosen,setChosen]=useState(null);const [score,setScore]=useState(0);

  const start=(s)=>{setSel(s);setQs([...(SAMPLE_QUIZZES[s.id]||[])].sort(()=>Math.random()-.5));setCur(0);setChosen(null);setScore(0);setStep("quiz");};
  const answer=(i)=>{if(chosen!==null)return;setChosen(i);const ok=i===qs[cur].answer;if(onRecordAnswer)onRecordAnswer(sel.id,ok);else if(ok)onXP(12);setTimeout(()=>{if(cur+1<qs.length){setCur(c=>c+1);setChosen(null);}else setStep("result");},1100);};

  if(step==="choose")return(
    <div style={{padding:"20px 20px 32px",animation:"fadeIn .3s ease"}}>
      <h2 style={{color:"#fff",margin:"0 0 6px",fontSize:22,fontFamily:"'Fredoka One',cursive"}}>🎯 Quiz</h2>
      <p style={{color:"#7c7cac",fontSize:13,marginBottom:22}}>Toutes les questions par matière</p>
      <div className="grid-2col" style={{display:"flex",flexDirection:"column",gap:12}}>
        {SUBJECTS.map(s=>(
          <button key={s.id} onClick={()=>start(s)} style={{background:"#1a1a2e",border:`1px solid ${s.color}44`,borderRadius:18,padding:"20px",cursor:"pointer",display:"flex",alignItems:"center",gap:16,width:"100%",transition:"border-color .2s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=s.color}
            onMouseLeave={e=>e.currentTarget.style.borderColor=`${s.color}44`}
          >
            <div style={{width:56,height:56,borderRadius:16,fontSize:28,background:`${s.color}22`,display:"flex",alignItems:"center",justifyContent:"center"}}>{s.emoji}</div>
            <div style={{textAlign:"left"}}><div style={{color:"#fff",fontWeight:700,fontSize:17}}>{s.label}</div><div style={{color:"#7c7cac",fontSize:13,marginTop:3}}>{SAMPLE_QUIZZES[s.id]?.length} questions disponibles</div></div>
            <span style={{marginLeft:"auto",color:s.color,fontSize:22}}>›</span>
          </button>
        ))}
      </div>
    </div>
  );

  if(step==="quiz"&&qs[cur]){
    const q=qs[cur];
    return(
      <div style={{padding:"20px 20px 32px",animation:"fadeIn .2s ease"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <span style={{color:sel.color,fontWeight:700,fontSize:15}}>{sel.emoji} {sel.label}</span>
          <QBadge n={qs.length}/>
          <span style={{color:"#7c7cac"}}>{cur+1}/{qs.length}</span>
        </div>
        <div style={{height:8,background:"#2d2d4e",borderRadius:99,marginBottom:22,overflow:"hidden"}}>
          <div style={{width:`${((cur+1)/qs.length)*100}%`,height:"100%",background:sel.color,borderRadius:99,transition:"width .4s"}}/>
        </div>
        <div style={{background:"#1a1a2e",borderRadius:20,padding:"28px 24px",border:"1px solid #2d2d4e",textAlign:"center",marginBottom:22,maxWidth:isTablet?680:"100%",marginLeft:"auto",marginRight:"auto"}}>
          <p style={{color:"#fff",fontSize:isTablet?20:18,fontWeight:700,margin:0,lineHeight:1.5}}>{q.q}</p>
        </div>
        <div className="grid-2col" style={{display:"flex",flexDirection:"column",gap:12,maxWidth:isTablet?680:"100%",margin:"0 auto"}}>
          {q.choices.map((c,i)=>{
            let bg="#1a1a2e",border="1px solid #2d2d4e",col="#fff";
            if(chosen!==null){if(i===q.answer){bg="#0d2b22";border="1px solid #43B89C";col="#43B89C";}else if(i===chosen){bg="#2b0d0d";border="1px solid #FF6584";col="#FF6584";}}
            return <button key={i} onClick={()=>answer(i)} style={{background:bg,border,borderRadius:14,padding:"15px 20px",color:col,fontWeight:600,fontSize:15,cursor:"pointer",textAlign:"left",transition:"all .3s",width:"100%"}}><span style={{opacity:.5,marginRight:10}}>{["A","B","C","D"][i]}.</span>{c}</button>;
          })}
        </div>
      </div>
    );
  }

  if(step==="result"){
    const pct=Math.round((score/qs.length)*100);
    return(
      <div style={{padding:"48px 20px 32px",textAlign:"center",animation:"fadeIn .3s ease"}}>
        <div style={{fontSize:72,marginBottom:14,animation:"pop .4s ease"}}>{pct===100?"🏆":pct>=75?"🌟":pct>=50?"💪":"📚"}</div>
        <h2 style={{color:"#fff",fontSize:28,fontFamily:"'Fredoka One',cursive",margin:"0 0 6px"}}>{pct===100?"Parfait !":pct>=75?"Très bien !":pct>=50?"Pas mal !":"Continue !"}</h2>

  const [hw,setHw]=useState(null);const [guessed,setGuessed]=useState([]);const [wrong,setWrong]=useState(0);
  const MAX=6;const AZ="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  const genCalc=()=>{const ops=["+","-","×"];const op=ops[~~(Math.random()*3)];let a,b,ans;if(op==="+"){a=~~(Math.random()*50)+1;b=~~(Math.random()*50)+1;ans=a+b;}else if(op==="-"){a=~~(Math.random()*50)+20;b=~~(Math.random()*20)+1;ans=a-b;}else{a=~~(Math.random()*12)+1;b=~~(Math.random()*12)+1;ans=a*b;}setCalcQ({a,b,op,answer:ans});setCalcInput("");setCalcFeedback(null);};
  const checkCalc=()=>{const ok=parseInt(calcInput)===calcQ.answer;setCalcFeedback(ok?"✅ Correct !":"❌ C'était "+calcQ.answer);if(ok){setCalcScore(s=>s+1);onXP(10);}setCalcRound(r=>r+1);setTimeout(()=>{if(calcRound+1<5)genCalc();else setGame("calc_result");},1100);};
  const startHm=()=>{const w=WORDS[~~(Math.random()*WORDS.length)];setHw(w);setGuessed([]);setWrong(0);};
  const guessL=(l)=>{if(guessed.includes(l))return;setGuessed(g=>[...g,l]);if(!hw.word.includes(l))setWrong(w=>w+1);};

// ── Calcul du rang adaptatif basé sur les stats réelles ──────────────────────
const RANKS = [
  { min:0,   label:"🌱 Débutant",     color:"#43B89C", desc:"Tu commences ton aventure !" },
  { min:40,  label:"📖 Apprenti",     color:"#6C63FF", desc:"Tu prends de bonnes habitudes !" },
  { min:55,  label:"⚡ Studieux",     color:"#F7B731", desc:"Tes efforts paient !" },
  { min:65,  label:"🔥 Assidu",       color:"#FF8C42", desc:"Tu progresses vraiment vite !" },
  { min:75,  label:"🌟 Expert",       color:"#FF6584", desc:"Tes connaissances s'élargissent !" },
  { min:85,  label:"🏆 Champion",     color:"#a78bfa", desc:"Tu maîtrises beaucoup de sujets !" },
  { min:92,  label:"🚀 Génie",        color:"#ffd43b", desc:"Un vrai crack ! Impressionnant !" },
];

const getRank = (stats) => {
  // score global 0-100 pondéré par quantité + qualité
  const {totalQ=0, correctQ=0, totalCards=0, totalVF=0, correctVF=0} = stats;
  if(totalQ===0 && totalCards===0) return RANKS[0];
  const quizRate  = totalQ>0     ? (correctQ/totalQ)*100       : 0;
  const vfRate    = totalVF>0    ? (correctVF/totalVF)*100     : 0;
  const cardBonus = Math.min(totalCards*2, 20);
  const score     = totalQ>0 ? quizRate*0.6 + vfRate*0.2 + cardBonus : cardBonus;
  return [...RANKS].reverse().find(r => score >= r.min) || RANKS[0];
};

// ── Graphique radar matières ──────────────────────────────────────────────────
const RadarChart = ({subjectStats}) => {
  const cx=90, cy=90, r=65;
  const subs = SUBJECTS.map((s,i)=>{
    const angle = (i/SUBJECTS.length)*2*Math.PI - Math.PI/2;
    const val   = Math.min((subjectStats[s.id]||0)/100, 1);
    return { ...s, angle, val,
      x: cx + Math.cos(angle)*r*val,
      y: cy + Math.sin(angle)*r*val,
      lx: cx + Math.cos(angle)*(r+18),
      ly: cy + Math.sin(angle)*(r+18),
    };
  });
  const polygon = subs.map(s=>`${s.x},${s.y}`).join(" ");
  const outer   = subs.map(s=>`${cx+Math.cos(s.angle)*r},${cy+Math.sin(s.angle)*r}`).join(" ");
  return(
    <svg width={180} height={180} viewBox="0 0 180 180">
      {/* Grilles */}
      {[.25,.5,.75,1].map(f=>(
        <polygon key={f} points={subs.map(s=>`${cx+Math.cos(s.angle)*r*f},${cy+Math.sin(s.angle)*r*f}`).join(" ")}
          fill="none" stroke="#2d2d4e" strokeWidth={1}/>
      ))}
      {/* Axes */}
      {subs.map(s=><line key={s.id} x1={cx} y1={cy} x2={cx+Math.cos(s.angle)*r} y2={cy+Math.sin(s.angle)*r} stroke="#2d2d4e" strokeWidth={1}/>)}
      {/* Zone compétence */}
      <polygon points={polygon} fill="#6C63FF33" stroke="#a78bfa" strokeWidth={2}/>
      {/* Points */}
      {subs.map(s=><circle key={s.id} cx={s.x} cy={s.y} r={4} fill={s.color}/>)}
      {/* Labels */}
      {subs.map(s=><text key={s.id} x={s.lx} y={s.ly} textAnchor="middle" dominantBaseline="middle" fontSize={11} fill="#7c7cac">{s.emoji}</text>)}
    </svg>
  );
};

              <button onClick={saveProfile} style={{width:"100%",background:"linear-gradient(135deg,#6C63FF,#a78bfa)",border:"none",borderRadius:12,padding:12,color:"#fff",fontWeight:700,cursor:"pointer",fontSize:15}}>
                💾 Enregistrer
              </button>
            </div>
          ) : (
            <div style={{display:"flex",alignItems:"center",gap:20}}>
              <div style={{width:80,height:80,borderRadius:"50%",background:"linear-gradient(135deg,#6C63FF,#a78bfa)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:40,boxShadow:"0 0 30px #6C63FF44",flexShrink:0}}>
                {profile.avatar||"🎓"}
              </div>
              <div>
                <h2 style={{color:"#fff",fontSize:22,margin:"0 0 4px",fontFamily:"'Fredoka One',cursive"}}>
                  {profile.name||"Mon Profil"}
                </h2>
                <p style={{color:"#a78bfa",margin:"0 0 8px",fontSize:14}}>Élève de {profile.classe||"5ème"}</p>
                {/* Rang adaptatif */}
                <div style={{display:"inline-flex",alignItems:"center",gap:8,background:`${rank.color}22`,border:`1px solid ${rank.color}44`,borderRadius:20,padding:"4px 14px"}}>
                  <span style={{color:rank.color,fontWeight:800,fontSize:13}}>{rank.label}</span>
                </div>
              </div>
            </div>
          )}
        </div>

        {/* ── DESCRIPTION DU RANG ── */}
        {!editing && (
          <div style={{background:`${rank.color}11`,border:`1px solid ${rank.color}33`,borderRadius:14,padding:"12px 16px",marginBottom:20,textAlign:"center"}}>
            <p style={{color:rank.color,margin:0,fontSize:14,fontWeight:600}}>{rank.desc}</p>
          </div>
        )}

        {/* ── STATS XP ── */}
        <div className="grid-2col" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
          {[
            {label:"Niveau",  value:level,           emoji:"⬆️", color:"#6C63FF"},
            {label:"XP Total",value:xp,              emoji:"⭐", color:"#F7B731"},
            {label:"Série",   value:`${streak}j`,    emoji:"🔥", color:"#FF6584"},
            {label:"Cours",   value:courses.length,  emoji:"📚", color:"#43B89C"},
          ].map(s=>(
            <div key={s.label} style={{background:"#1a1a2e",borderRadius:16,padding:"18px 14px",border:`1px solid ${s.color}33`,textAlign:"center"}}>
              <div style={{fontSize:26,marginBottom:4}}>{s.emoji}</div>
              <div style={{color:s.color,fontWeight:800,fontSize:24}}>{s.value}</div>
              <div style={{color:"#7c7cac",fontSize:12}}>{s.label}</div>
            </div>
          ))}
        </div>

        {/* ── PERFORMANCE ADAPTATIVE ── */}
        <div style={{background:"#1a1a2e",borderRadius:18,padding:20,border:"1px solid #2d2d4e",marginBottom:20}}>
          <h3 style={{color:"#fff",fontSize:15,margin:"0 0 16px",fontWeight:700}}>📊 Mes performances</h3>

          {/* Radar matières */}
          <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:18,flexWrap:"wrap"}}>
            <RadarChart subjectStats={stats.bySubject||{}}/>
            <div style={{flex:1,minWidth:140}}>
              {SUBJECTS.map(s=>{
                const rate=Math.round(stats.bySubject?.[s.id]||0);
                return(
                  <div key={s.id} style={{marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                      <span style={{color:"#c5c5e0",fontSize:12}}>{s.emoji} {s.label}</span>
                      <span style={{color:s.color,fontSize:12,fontWeight:700}}>{rate}%</span>
                    </div>
                    <div style={{height:5,background:"#2d2d4e",borderRadius:99,overflow:"hidden"}}>
                      <div style={{width:`${rate}%`,height:"100%",background:s.color,borderRadius:99,transition:"width .8s"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Résumé chiffres */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            {[
              {label:"Quiz réussi",  value:`${quizRate}%`, emoji:"🎯", color:"#FF6584",  sub:`${stats.correctQ||0}/${stats.totalQ||0}`},
              {label:"Vrai/Faux",    value:`${vfRate}%`,   emoji:"⚡", color:"#F7B731",  sub:`${stats.correctVF||0}/${stats.totalVF||0}`},
              {label:"Cartes vues",  value:stats.totalCards||0, emoji:"🃏", color:"#43B89C", sub:"flashcards"},
            ].map(s=>(
              <div key={s.label} style={{background:"#0f0f23",borderRadius:12,padding:"12px 10px",textAlign:"center",border:`1px solid ${s.color}22`}}>
                <div style={{fontSize:20,marginBottom:4}}>{s.emoji}</div>
                <div style={{color:s.color,fontWeight:800,fontSize:18}}>{s.value}</div>
                <div style={{color:"#7c7cac",fontSize:10,marginTop:2}}>{s.label}</div>
                <div style={{color:"#4a4a6a",fontSize:10}}>{s.sub}</div>
              </div>
            ))}
          </div>
        </div>

        {/* ── BADGES ── */}
        <h3 style={{color:"#a78bfa",fontSize:12,letterSpacing:2,textTransform:"uppercase",margin:"0 0 14px",fontWeight:700}}>Mes Badges</h3>
        <div style={{background:"#1a1a2e",borderRadius:20,padding:20,border:"1px solid #2d2d4e",display:"flex",gap:16,flexWrap:"wrap",justifyContent:"center",marginBottom:20}}>
          {badges.map(b=><BadgeItem key={b.id} {...b}/>)}
        </div>

        {/* Clé API */}
        <div style={{background:"#1a1a2e",borderRadius:16,padding:16,border:"1px solid #2d2d4e"}}>
          <p style={{color:"#7c7cac",fontSize:13,margin:"0 0 10px",fontWeight:700}}>⚙️ Paramètres</p>
          <button onClick={()=>{setApiKey('');onChangeKey();}} style={{width:"100%",background:"#0f0f23",border:"1px solid #2d2d4e",borderRadius:10,padding:"10px 14px",color:"#FF6584",cursor:"pointer",fontSize:13,textAlign:"left",fontWeight:600}}>
            🔑 Changer la clé API Anthropic
          </button>
        </div>
      </div>
    </div>
  );
};

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
// ── Écran de configuration clé API ────────────────────────────────────────
const SetupScreen = ({onSave}) => {
  const [key, setKey] = useState('');
  const [testing, setTesting] = useState(false);
  const [error, setError] = useState('');
  const [showKey, setShowKey] = useState(false);

  const testAndSave = async () => {
    const trimmed = key.trim();
    // Validation souple : la clé doit juste contenir "sk-ant"
    if (!trimmed.includes('sk-ant')) {
      setError("La clé Anthropic doit contenir 'sk-ant'. Vérifie la copie.");
      return;
    }
    setTesting(true); setError('');
    try {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        mode: "cors",
        cache: "no-store",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": trimmed,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 10,
          messages: [{role:"user", content:"ok"}]
        })
      });
      const data = await r.json().catch(()=>({}));
      if (r.status === 401) {
        setError("❌ Clé refusée par Anthropic. Vérifie qu'elle est bien copiée en entier.");
        setTesting(false);
        return;
      }
      if (!r.ok) {
        setError("Erreur " + r.status + " : " + (data?.error?.message || "réessaie"));
        setTesting(false);
        return;
      }
      // ✅ Clé valide — on sauvegarde
      setApiKey(trimmed);
      onSave();
    } catch(e) {
      // Sur iOS, le CORS peut bloquer même avec une bonne clé
      // On sauvegarde quand même si la clé a le bon format
      if (trimmed.includes('sk-ant') && trimmed.length > 20) {
        setApiKey(trimmed);
        onSave();
      } else {
        setError("Connexion impossible : " + e.message);
      }
    }
    setTesting(false);
  };

  return (
    <div style={{
      minHeight:"100vh", background:"#0f0f23",
      display:"flex", flexDirection:"column", alignItems:"center",
      justifyContent:"center", padding:"24px", fontFamily:"'Nunito',sans-serif"
    }}>
      <div style={{maxWidth:420, width:"100%"}}>
        {/* Logo */}
        <div style={{textAlign:"center", marginBottom:32}}>
          <div style={{fontSize:64, marginBottom:12}}>🚀</div>
          <h1 style={{color:"#fff", fontSize:32, margin:"0 0 6px", fontFamily:"'Fredoka One',cursive"}}>
            Study<span style={{color:"#a78bfa"}}>Quest</span>
          </h1>
          <p style={{color:"#7c7cac", margin:0, fontSize:15}}>L'app d'apprentissage de ton fils 🎓</p>
        </div>

        {/* Card config */}
        <div style={{background:"#1a1a2e", borderRadius:20, padding:24, border:"1px solid #6C63FF44"}}>
          <h2 style={{color:"#fff", fontSize:18, margin:"0 0 8px"}}>🔑 Configuration initiale</h2>
          <p style={{color:"#7c7cac", fontSize:13, margin:"0 0 20px", lineHeight:1.6}}>
            Pour que l'IA génère les quiz et activités, il faut une clé API Anthropic.
            C'est <strong style={{color:"#a78bfa"}}>gratuit pour commencer</strong> (5$ de crédit offert).
          </p>

          {/* Étapes */}
          <div style={{background:"#0f0f23", borderRadius:12, padding:16, marginBottom:20}}>
            <p style={{color:"#a78bfa", fontWeight:700, fontSize:13, margin:"0 0 10px"}}>📋 Comment obtenir une clé ?</p>
            {[
              "Va sur console.anthropic.com",
              "Crée un compte gratuit",
              "Clique sur \"API Keys\" → \"Create Key\"",
              "Copie la clé (commence par sk-ant-...)",
              "Colle-la ici 👇"
            ].map((s,i)=>(
              <div key={i} style={{display:"flex", gap:10, marginBottom:6, alignItems:"flex-start"}}>
                <span style={{color:"#6C63FF", fontWeight:800, fontSize:13, flexShrink:0, minWidth:18}}>{i+1}.</span>
                <span style={{color:"#c5c5e0", fontSize:13}}>{s}</span>
              </div>
            ))}
          </div>

          {/* Input clé */}
          <div style={{position:"relative", marginBottom:12}}>
            <input
              value={key}
              onChange={e=>setKey(e.target.value)}
              type={showKey?"text":"password"}
              placeholder="sk-ant-api03-..."
              style={{
                width:"100%", background:"#0f0f23", border:"1px solid #2d2d4e",
                borderRadius:10, padding:"12px 44px 12px 14px", color:"#fff",
                fontSize:14, outline:"none", boxSizing:"border-box",
                fontFamily:"monospace"
              }}
            />
            <button onClick={()=>setShowKey(s=>!s)} style={{
              position:"absolute", right:10, top:"50%", transform:"translateY(-50%)",
              background:"none", border:"none", color:"#7c7cac", cursor:"pointer", fontSize:16
            }}>{showKey?"🙈":"👁️"}</button>
          </div>

          {error && (
            <div style={{background:"#200a0a", border:"1px solid #FF658444", borderRadius:10, padding:"10px 14px", marginBottom:12}}>
              <p style={{color:"#FF6584", fontSize:13, margin:0}}>❌ {error}</p>
            </div>
          )}

          <button onClick={testAndSave} disabled={!key.trim() || testing} style={{
            width:"100%", background:key.trim()?"linear-gradient(135deg,#6C63FF,#a78bfa)":"#2d2d4e",
            border:"none", borderRadius:12, padding:"14px", color:"#fff",
            fontWeight:700, cursor:key.trim()?"pointer":"not-allowed", fontSize:16
          }}>
            {testing ? "⏳ Vérification..." : "✅ Enregistrer et démarrer"}
          </button>

          <p style={{color:"#4a4a6a", fontSize:11, textAlign:"center", margin:"12px 0 0", lineHeight:1.5}}>
            🔒 La clé est stockée uniquement sur cet appareil.<br/>
            Elle n'est jamais partagée ni envoyée ailleurs.
          </p>
        </div>
      </div>
    </div>
  );
};

function App(){
  const isTablet = useIsTablet();
  const [hasKey, setHasKey] = useState(()=>!!getApiKey());
  const [view,setView]   = useState("home");
  const [xp,setXp]       = useState(()=>load("sq_xp",120));
  const [level,setLevel] = useState(()=>load("sq_level",2));
  const [streak]         = useState(()=>load("sq_streak",5));
  const [courses,setCourses]               = useState(()=>load("sq_courses",[]));
  const [selectedCourse,setSelectedCourse] = useState(null);
  const [badges,setBadges] = useState(()=>load("sq_badges",[
    {id:1,emoji:"🌟",label:"Premier cours",  unlocked:false},
    {id:2,emoji:"📷",label:"Photo analysée", unlocked:false},
    {id:3,emoji:"🏆",label:"Quiz parfait",   unlocked:false},
    {id:4,emoji:"🔥",label:"7 jours streak", unlocked:false},
    {id:5,emoji:"📚",label:"5 cours créés",  unlocked:false},
    {id:6,emoji:"⚡",label:"Calcul mental",  unlocked:false},
  ]));

  // ── Profil éditable ──────────────────────────────────────────────────────
  const [profile,setProfile] = useState(()=>load("sq_profile",{name:"",classe:"5ème",avatar:"🎓"}));

  // ── Stats adaptatives : tout ce qui se passe dans l'app est tracké ───────
  // bySubject : score 0-100 par matière (moyenne glissante)
  const [stats,setStats] = useState(()=>load("sq_stats",{
    totalQ:0, correctQ:0,
    totalVF:0, correctVF:0,
    totalCards:0,
    bySubject:{math:0,french:0,history:0,science:0,english:0},
  }));

  useEffect(()=>save("sq_xp",     xp),     [xp]);
  useEffect(()=>save("sq_level",  level),  [level]);
  useEffect(()=>save("sq_courses",courses),[courses]);
  useEffect(()=>save("sq_badges", badges), [badges]);
  useEffect(()=>save("sq_profile",profile),[profile]);
  useEffect(()=>save("sq_stats",  stats),  [stats]);

  const addXP = (amt) => setXp(prev=>{
    const next=prev+amt, needed=level*100;
    if(next>=needed){ setLevel(l=>l+1); return next-needed; }
    return next;
  });

  // Enregistre une réponse quiz et met à jour le score de la matière
  const recordAnswer = (subjectId, correct) => {
    setStats(s=>{
      const prev    = s.bySubject[subjectId]||0;
      // Moyenne glissante pondérée : 80% ancien score + 20% nouveau résultat
      const updated = prev*0.8 + (correct?100:0)*0.2;
      return {
        ...s,
        totalQ:   s.totalQ+1,
        correctQ: s.correctQ+(correct?1:0),
        bySubject: {...s.bySubject, [subjectId]: Math.round(updated)},
      };
    });
    if(correct) addXP(10); else addXP(2); // même une mauvaise réponse rapporte un peu
  };

  const recordVF = (subjectId, correct) => {
    setStats(s=>{
      const prev    = s.bySubject[subjectId]||0;
      const updated = prev*0.85 + (correct?100:0)*0.15;
      return {
        ...s,
        totalVF:   s.totalVF+1,
        correctVF: s.correctVF+(correct?1:0),
        bySubject: {...s.bySubject, [subjectId]: Math.round(updated)},
      };
    });
    if(correct) addXP(8); else addXP(1);
  };

  const recordCard = (subjectId) => {
    setStats(s=>({...s, totalCards:s.totalCards+1,
      bySubject:{...s.bySubject,[subjectId]:Math.min((s.bySubject[subjectId]||0)+2,100)}}));
    addXP(5);
  };

  const addCourse=(c)=>{
    setCourses(arr=>[c,...arr]);
    setBadges(b=>b.map(badge=>
      badge.id===1?{...badge,unlocked:true}:
      (badge.id===2&&c.analysis&&!c.analysis.error)?{...badge,unlocked:true}:badge
    ));
    addXP(50);
  };

  const updateCourse=(id,analysis)=>{
    setCourses(arr=>arr.map(c=>c.id===id?{...c,analysis}:c));
  };

  const updateProfile=(p)=>{ setProfile(p); };

  const NAV=[
    {id:"home",       emoji:"🏠",label:"Accueil"},
    {id:"courses",    emoji:"📚",label:"Cours"},
    {id:"quiz",       emoji:"🎯",label:"Quiz"},
    {id:"flashcards", emoji:"🃏",label:"Cartes"},
    {id:"games",      emoji:"🎮",label:"Jeux"},
    {id:"profile",    emoji:"👤",label:"Profil"},
  ];

  const navigate=(v)=>{ setView(v); setSelectedCourse(null); };

  const renderContent=()=>{
    if(view==="courses"&&selectedCourse)
      return <CourseDetail course={selectedCourse} onBack={()=>setSelectedCourse(null)} onXP={addXP} onRecordAnswer={recordAnswer} onRecordVF={recordVF} onRecordCard={recordCard} onUpdateCourse={updateCourse} isTablet={isTablet}/>;
    switch(view){
      case "home":       return <HomeView       xp={xp} level={level} streak={streak} badges={badges} courses={courses} onNavigate={navigate} isTablet={isTablet} profile={profile} rank={getRank(stats)}/>;
      case "courses":    return <CoursesView    courses={courses} onAddCourse={addCourse} onViewCourse={setSelectedCourse} isTablet={isTablet}/>;
      case "quiz":       return <QuizView       onXP={addXP} onRecordAnswer={recordAnswer} isTablet={isTablet}/>;
      case "flashcards": return <FlashcardsView onXP={addXP} onRecordCard={recordCard} isTablet={isTablet}/>;
      case "games":      return <GamesView      onXP={addXP} isTablet={isTablet}/>;
      case "profile":    return <ProfileView    xp={xp} level={level} streak={streak} badges={badges} courses={courses} stats={stats} profile={profile} onUpdateProfile={updateProfile} onChangeKey={()=>setHasKey(false)} isTablet={isTablet}/>;
      default: return null;
    }
  };

  // Afficher l'écran de config si pas de clé
  if (!hasKey) return <SetupScreen onSave={()=>setHasKey(true)}/>;

  return(
    <div className="app-shell">

      {/* ── SIDEBAR iPad ──────────────────────────────────────────────── */}
      <div className="app-sidebar">
        <Sidebar view={view} onNavigate={navigate} xp={xp} level={level} streak={streak} courses={courses}/>
      </div>

      {/* ── BODY ──────────────────────────────────────────────────────── */}
      <div className="app-body">

        {/* Topbar */}
        <div className="app-topbar" style={{background:"#0f0f23ee",backdropFilter:"blur(12px)",borderBottom:"1px solid #2d2d4e",padding:"14px 20px",display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22}}>🚀</span>
          <span style={{color:"#fff",fontWeight:800,fontSize:18,fontFamily:"'Fredoka One',cursive"}}>
            Study<span style={{color:"#a78bfa"}}>Quest</span>
          </span>
          {/* Sur iPad : titre de la section courante */}
          {isTablet && (
            <span style={{color:"#4a4a6a",fontSize:14,marginLeft:4}}>
              / {NAV.find(n=>n.id===view)?.label||""}
            </span>
          )}
          <span style={{marginLeft:"auto",background:"#F7B73122",color:"#F7B731",borderRadius:20,padding:"4px 14px",fontSize:13,fontWeight:700}}>⭐ {xp} XP</span>
        </div>

        {/* Content */}
        <div className="app-content">
          <div className="content-inner">
            {renderContent()}
          </div>
        </div>

        {/* Bottom nav iPhone uniquement */}
        <div className="app-bottomnav" style={{background:"#0f0f23ee",backdropFilter:"blur(16px)",borderTop:"1px solid #2d2d4e",display:"flex",padding:"8px 4px",paddingBottom:"calc(8px + env(safe-area-inset-bottom))"}}>
          {NAV.map(n=>{
            const active=view===n.id;
            return(
              <button key={n.id} onClick={()=>navigate(n.id)} style={{flex:1,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"4px 2px"}}>
                <div style={{fontSize:20,filter:active?"none":"grayscale(.6) opacity(.5)",transform:active?"scale(1.15)":"scale(1)",transition:"all .2s"}}>{n.emoji}</div>
                <span style={{fontSize:10,color:active?"#a78bfa":"#4a4a6a",fontWeight:active?800:600}}>{n.label}</span>
                {active&&<div style={{width:16,height:3,background:"#a78bfa",borderRadius:99}}/>}
              </button>
            );
          })}
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
if('serviceWorker'in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(r=>console.log('✅ SW:',r.scope))
      .catch(e=>console.log('❌ SW:',e));
  });
}

const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone===true;
if(isIOS&&!isStandalone&&!sessionStorage.getItem('sq_banner')){
  setTimeout(()=>{
    const b=document.getElementById('install-banner');
    if(b){b.classList.add('visible');sessionStorage.setItem('sq_banner','1');setTimeout(()=>b.classList.remove('visible'),8000);}
  },2000);
}

document.addEventListener('touchmove',e=>{
  if(e.target.closest('.app-content')||e.target.closest('[style*="overflow-y"]'))return;
  e.preventDefault();
},{passive:false});
</script>
</body>
